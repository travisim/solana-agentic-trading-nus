<style>/* Shared look: Workshop 1 deck (black, lavender, mint, thin-outline rounded boxes). No libraries, no web fonts. */

}

.page{max-width:1800px;margin:0 auto;padding:1.1rem 3rem .8rem;display:flex;flex-direction:column;height:100vh;gap:.6rem}
h1{font-weight:300;font-size:2.8rem;line-height:1.05;margin:0;letter-spacing:-.01em}
.cap{color:var(--lav);font-size:1.3rem;margin:0;font-weight:300}
.src{color:var(--muted);font-size:.72rem;margin-top:auto;padding-top:.3rem;flex:none;display:flex;justify-content:space-between;gap:1rem}

.box.mint{border-color:var(--mint)} .box.warn{border-color:var(--warn)} .box.bad{border-color:var(--bad)} .box.lav{border-color:var(--lav)}

.row{display:flex;gap:1rem;align-items:center}

svg .m{fill:var(--muted)} svg .l{fill:var(--lav)}
/* controls */
.ctl{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr 6.5rem;align-items:center;gap:1rem;font-size:1.1rem}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.2rem;background:transparent;margin:0;cursor:pointer}

</style></head><body>
<div class="page">
<h1>The risk hook: a gate between idea and action</h1>
<p class="cap">Move the limits. Each order is checked live against four rules and is either accepted or rejected, with a reason.</p>
<main id="main" aria-label="The risk hook: a gate between idea and action demo">
<div class="grid" style="grid-template-columns:1fr 2.1fr;flex:1;min-height:0">
  <div class="grid" style="align-content:start;gap:.9rem">
    <div class="box" style="display:grid;gap:.2rem">
      <div class="lab">Limits (drag)</div>
      <div class="ctl" style="grid-template-columns:1fr 6rem"><label for="mn" style="grid-column:1/-1">Max notional (USD)</label><input id="mn" type="range" min="100" max="6000" step="50" aria-label="Maximum order notional in USD"><output id="mno" for="mn"></output></div>
      <div class="ctl" style="grid-template-columns:1fr 6rem"><label for="mg" style="grid-column:1/-1">Max oracle gap (bps)</label><input id="mg" type="range" min="1" max="200" step="1" aria-label="Maximum gap between order price and oracle price in basis points"><output id="mgo" for="mg"></output></div>
      <div class="ctl" style="grid-template-columns:1fr 6rem"><label for="ma" style="grid-column:1/-1">Max oracle age (seconds)</label><input id="ma" type="range" min="1" max="300" step="1" aria-label="Maximum age of the oracle price in seconds"><output id="mao" for="ma"></output></div>
    </div>
    <div class="box" id="rules"></div>
    <div class="box" id="score" aria-live="polite"></div>
  </div>
  <div class="box" style="display:flex;flex-direction:column;min-height:0">
    <div class="grid lab" style="grid-template-columns:1.5fr 1.3fr 2.6fr;padding:0 .3rem .4rem"><span>Order</span><span>Hook: N  G  A  U</span><span>Result</span></div>
    <div id="orders" style="flex:1;display:grid;gap:.4rem;grid-auto-rows:1fr;min-height:0"></div>
  </div>
</div>
</main>
<div class="src" id="src"></div>
</div>
<script>const NS="http://www.w3.org/2000/svg";
const $=(s,r=document)=>r.querySelector(s);
function S(tag,attrs={},parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function H(tag,attrs={},parent,text){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const HASH=new URLSearchParams(location.hash.slice(1));
const hv=(k,d)=>HASH.has(k)?HASH.get(k):d;
const bps=(a,b)=>(a/b-1)*1e4;
const f2=(x,n=2)=>Number(x).toFixed(n);
function dateOf(sec){return new Date(sec*1000).toISOString().replace('T',' ').slice(0,16)+' UTC'}
/* footer caption: says whether the data is recorded/live/fixture and its date */
function sourceLine(el,data,what,extraTs){
  const fx=Object.values(data).some(d=>d&&d.fixture);
  const d0=Object.values(data).find(d=>d.generatedAt)||data[Object.keys(data)[0]];
  const mode=d0.mode||'recorded';
  const when=(d0.generatedAt||'').slice(0,10)||(extraTs?dateOf(extraTs).slice(0,10):'date unknown');
  el.innerHTML='';
  const a=H('span',{},el);
  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.textContent=(mode==='live'?'Live data':'Recorded data')+', captured '+when+'. ';
  a.appendChild(document.createTextNode(what+' Public mainnet reads, no keys.'));
  H('span',{},el,'Build night 1');
}
</script>
<script>/* Live mode for the lab demos. Plain JS, no libraries, inlined into every demo by build.mjs.
 * Reads only: public Solana RPC, the Jupiter quote API, and two on-chain accounts (Pyth price, Orca pool).
 * No keys, no wallets, no writes. Recorded data stays the default; Live is opt-in.
 *
 * Browser-safe endpoints (tested Oct 22, 2026):
 *   RPC      https://solana-rpc.publicnode.com   (CORS open; api.mainnet.solana.com returns 403 to browser origins)
 *   Jupiter  https://lite-api.jup.ag/swap/v1/quote
 * The decoders below are plain-JS ports of demo-repo/code/src/collectors/{jupiter,pyth,orca}.ts.
 *
 * Test switches (URL): ?live=1 starts live. &fail=N makes the Nth live tick fail, to test the fallback (fail=1: first tick).
 */
const LIVE=(()=>{
const RPC='https://solana-rpc.publicnode.com';
const SOL='So11111111111111111111111111111111111111112', USDC='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
const JUP_URL='https://lite-api.jup.ag/swap/v1/quote?inputMint='+SOL+'&outputMint='+USDC+'&amount=1000000000&slippageBps=50';
const PYTH_PROGRAM='rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ', PYTH_ACCOUNT='7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE';
const PYTH_FEED='ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d', PYTH_DISC='22f123639d7ef4cd';
const WHIRL_PROGRAM='whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc', ORCA_POOL='Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE';
const POLL_MS=5000, MAX_POINTS=120, TIMEOUT_MS=8000;
const params=new URLSearchParams(location.search+'&'+location.hash.slice(1));
const FAIL_AT=params.has('fail')?(+params.get('fail')||1):0;

class RateLimit extends Error{constructor(h){super('HTTP 429 (rate limited) from '+h);this.rate=true}}
async function getJson(url,init){
  const host=new URL(url).host, ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),TIMEOUT_MS);
  try{const r=await fetch(url,Object.assign({signal:ctl.signal},init));
    if(r.status===429)throw new RateLimit(host);
    if(!r.ok)throw new Error('HTTP '+r.status+' from '+host);
    return await r.json()}
  catch(e){if(e.name==='AbortError')throw new Error('timeout from '+host);throw e}
  finally{clearTimeout(to)}
}
async function getAccount(address){
  const j=await getJson(RPC,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method:'getAccountInfo',params:[address,{encoding:'base64',commitment:'confirmed'}]})});
  if(j.error)throw new Error('RPC error: '+j.error.message);
  const v=j.result&&j.result.value; if(!v)throw new Error('account '+address+' not found');
  const bin=atob(v.data[0]), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return {bytes,owner:v.owner,slot:j.result.context.slot};
}
const ALPHA='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function base58(bytes){let n=0n;for(const b of bytes)n=(n<<8n)|BigInt(b);let o='';while(n>0n){o=ALPHA[Number(n%58n)]+o;n/=58n}
  for(const b of bytes){if(b!==0)break;o='1'+o}return o}
const hex=(b,a,z)=>Array.from(b.slice(a,z),x=>x.toString(16).padStart(2,'0')).join('');

/* venue price: what 1 SOL sells for, routed by Jupiter */
async function fetchJupiterQuote(){
  const q=await getJson(JUP_URL); if(!q.outAmount)throw new Error('Jupiter quote had no outAmount');
  return {price:Number(q.outAmount)/1e6};
}
/* oracle price: the Pyth PriceUpdateV2 account, decoded from raw bytes (layout in code/src/collectors/pyth.ts) */
async function fetchPythPrice(){
  const a=await getAccount(PYTH_ACCOUNT), b=a.bytes;
  if(a.owner!==PYTH_PROGRAM)throw new Error('unexpected Pyth account owner');
  if(b.length<133||hex(b,0,8)!==PYTH_DISC)throw new Error('not a Pyth PriceUpdateV2 account');
  if(hex(b,41,73)!==PYTH_FEED)throw new Error('Pyth account holds a different feed');
  const v=new DataView(b.buffer,b.byteOffset,b.byteLength), exp=v.getInt32(89,true);
  const price=Number(v.getBigInt64(73,true))*10**exp, conf=Number(v.getBigInt64(81,true))*10**exp;
  return {price,confBps:conf/price*1e4,publishTime:Number(v.getBigInt64(93,true)),postedSlot:Number(v.getBigUint64(125,true)),slot:a.slot};
}
/* pool price: Orca Whirlpool SOL/USDC, price from sqrtPrice (Q64.64) (layout in code/src/collectors/orca.ts) */
async function fetchOrcaPrice(){
  const a=await getAccount(ORCA_POOL), b=a.bytes;
  if(a.owner!==WHIRL_PROGRAM)throw new Error('unexpected pool owner');
  if(b.length<213)throw new Error('Whirlpool account too short');
  if(base58(b.slice(101,133))!==SOL||base58(b.slice(181,213))!==USDC)throw new Error('pool is not SOL/USDC');
  const v=new DataView(b.buffer,b.byteOffset,b.byteLength);
  const sq=v.getBigUint64(65,true)|(v.getBigUint64(73,true)<<64n), root=Number(sq)/2**64;
  return {price:root*root*1e3,slot:a.slot};
}
/* one tick: all three reads in parallel, one snapshot out */
let tickNo=0; const JUP={q:null,at:0,note:null}, JUP_EVERY_MS=20000;
async function fetchSnapshot(){
  if(FAIL_AT&&++tickNo>=FAIL_AT)throw new RateLimit('forced-failure.test (?fail='+FAIL_AT+')');
  // Jupiter's free quote API throttles per IP (a whole classroom shares one), so ask it at most every 20 s and
  // keep going on the last quote (or the pool price) if it says 429. Only Pyth/Orca RPC failures fall back to recorded.
  const jupP=(Date.now()-JUP.at<JUP_EVERY_MS&&JUP.q)?Promise.resolve(null):fetchJupiterQuote().then(q=>{JUP.q=q;JUP.at=Date.now();JUP.note=null;return q},e=>{JUP.at=Date.now()-JUP_EVERY_MS+5000;JUP.note=e&&e.rate?'Jupiter throttled, using last quote':'Jupiter unavailable, using last quote';return null});
  const [,p,o]=await Promise.all([jupP,fetchPythPrice(),fetchOrcaPrice()]);
  const t=Math.floor(Date.now()/1000);
  const jup=JUP.q?JUP.q.price:o.price;
  return {t,jupiter:jup,jupiterNote:JUP.q?JUP.note:(JUP.note||'Jupiter unavailable, showing pool price'),pyth:p.price,orca:o.price,confBps:p.confBps,publishTime:p.publishTime,postedSlot:p.postedSlot,
    slot:Math.max(p.slot,o.slot),oracleAgeSec:Math.max(0,t-p.publishTime)};
}

/* ---- state, pill UI, polling, fallback ---- */
const S={live:false,hist:[],last:null,err:null,timer:null,busy:false,onTick:null,onMode:null,bar:null,recNote:'bundled data'};
const el=(tag,cls,parent,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e};
const clock=t=>new Date(t*1000).toLocaleTimeString('en-GB');
function paint(extra){
  const B=S.bar; if(!B)return;
  B.rec.setAttribute('aria-pressed',String(!S.live)); B.liv.setAttribute('aria-pressed',String(S.live));
  B.pill.className='pill '+(S.live?'mint':'lavc'); B.pill.textContent=S.live?'LIVE':'RECORDED';
  B.err.hidden=!S.err; if(S.err){B.err.textContent=S.err.short;B.err.title=S.err.detail}
  if(S.live&&S.last)B.txt.textContent='updated '+clock(S.last.t)+' · slot '+S.last.slot.toLocaleString('en-US')+(extra?' · '+extra:'');
  else if(S.live)B.txt.textContent='connecting to public Solana data...'+(extra?' '+extra:'');
  else B.txt.textContent=S.recNote;
}
function schedule(ms){clearTimeout(S.timer);S.timer=null;if(S.live&&!document.hidden)S.timer=setTimeout(tick,ms)}
async function tick(){
  if(!S.live||S.busy||document.hidden)return;
  S.busy=true;
  try{
    const snap=await fetchSnapshot(); if(!S.live)return;
    S.last=snap; S.hist.push({t:snap.t,jupiter:snap.jupiter,pyth:snap.pyth,orca:snap.orca});
    if(S.hist.length>MAX_POINTS)S.hist.shift();
    paint(snap.jupiterNote); if(S.onTick)S.onTick(snap,S.hist);
  }catch(e){ if(S.live)fallback(e) }
  finally{S.busy=false; schedule(POLL_MS)}
}
function fallback(e){
  S.err={short:e&&e.rate?'rate limited, back to recorded':'live data failed, back to recorded',detail:String(e&&e.message||e)};
  setLive(false,true);
}
function setLive(on,keepErr){
  if(on===S.live)return;
  S.live=on; clearTimeout(S.timer);
  if(on){S.err=null;S.hist=[];S.last=null;paint();tick()}
  else{S.last=null;if(!keepErr)S.err=null;paint()}
  if(S.onMode)S.onMode(on,S.err);
}
document.addEventListener('visibilitychange',()=>{
  if(!S.live)return;
  if(document.hidden){clearTimeout(S.timer);S.timer=null;paint('paused, tab hidden')}
  else{paint();tick()}
});
/* startLive(onTick, {onMode, recordedNote}): builds the Recorded/Live switch and pill, starts live if ?live=1 */
function startLive(onTick,opts){
  opts=opts||{}; S.onTick=onTick; S.onMode=opts.onMode||null; if(opts.recordedNote)S.recNote=opts.recordedNote;
  const bar=el('div','livebar'); bar.setAttribute('role','group'); bar.setAttribute('aria-label','Data mode: recorded or live');
  const top=el('div','lvtop',bar), sub=el('div','lvsub',bar), seg=el('div','seg',top);
  const rec=el('button',null,seg,'Recorded'), liv=el('button',null,seg,'Live'); rec.type=liv.type='button';
  const pill=el('span','pill lavc',top,'RECORDED'); pill.title='Live reads: Jupiter quote, Pyth price account, Orca pool account (public RPC)';
  const txt=el('span','lvtxt mut',sub), err=el('span','pill badc',sub); err.hidden=true;
  err.setAttribute('role','status');
  S.bar={rec,liv,pill,txt,err};
  rec.onclick=()=>setLive(false); liv.onclick=()=>setLive(true);
  document.querySelector('.page').appendChild(bar);
  paint();
  if(params.get('live')==='1')setLive(true);
  return {setLive,isLive:()=>S.live};
}
/* footer caption while live (the recorded caption comes from sourceLine in common.js) */
function liveSource(elm,what){
  elm.innerHTML=''; const a=el('span',null,elm,'Live data'+(S.last?', updated '+clock(S.last.t):'')+'. '+what+' Public mainnet reads, no keys, nothing is written.');
  el('span',null,elm,'Build night 1');
}
return {startLive,fetchJupiterQuote,fetchPythPrice,fetchOrcaPrice,fetchSnapshot,liveSource,
  isLive:()=>S.live,last:()=>S.last,hist:()=>S.hist,MAX_POINTS,POLL_MS};
})();
</script>
<script>
const RISK={"rules":[{"id":"max-notional","description":"Reject any order bigger than the notional limit","limit":1000,"unit":"USD"},{"id":"max-oracle-gap","description":"Reject if the order price is too far from the oracle price","limit":50,"unit":"bps"},{"id":"max-oracle-age","description":"Reject if the oracle price is older than the limit","limit":60,"unit":"seconds"},{"id":"unit-sanity","description":"Reject non-positive, non-numeric or wrong-unit values (e.g. cents, lamports)","limit":null,"unit":null}],"context":{"oraclePrice":108.60542862,"oracleAgeSec":3},"decisions":[{"label":"normal buy","order":{"side":"buy","sizeUsd":250,"price":108.61},"oracleAgeSec":3,"ok":true,"rule":null,"reason":"within all limits"},{"label":"normal sell","order":{"side":"sell","sizeUsd":500,"price":108.61},"oracleAgeSec":3,"ok":true,"rule":null,"reason":"within all limits"},{"label":"right at the notional limit","order":{"side":"sell","sizeUsd":1000,"price":108.61},"oracleAgeSec":3,"ok":true,"rule":null,"reason":"within all limits"},{"label":"40 bps from oracle","order":{"side":"buy","sizeUsd":250,"price":109.04},"oracleAgeSec":3,"ok":true,"rule":null,"reason":"within all limits"},{"label":"oversized order","order":{"side":"buy","sizeUsd":5000,"price":108.61},"oracleAgeSec":3,"ok":false,"rule":"max-notional","reason":"5000 USD exceeds the 1000 USD limit"},{"label":"buy 100 bps above oracle","order":{"side":"buy","sizeUsd":250,"price":109.69},"oracleAgeSec":3,"ok":false,"rule":"max-oracle-gap","reason":"price is 99.9 bps from the oracle, limit is 50 bps"},{"label":"sell 100 bps below oracle","order":{"side":"sell","sizeUsd":250,"price":107.52},"oracleAgeSec":3,"ok":false,"rule":"max-oracle-gap","reason":"price is 99.9 bps from the oracle, limit is 50 bps"},{"label":"stale oracle (300 s old)","order":{"side":"buy","sizeUsd":250,"price":108.61},"oracleAgeSec":300,"ok":false,"rule":"max-oracle-age","reason":"oracle is 300 s old, limit is 60 s"},{"label":"price in cents, not dollars","order":{"side":"buy","sizeUsd":250,"price":10860.54},"oracleAgeSec":3,"ok":false,"rule":"unit-sanity","reason":"price 10860.54 is 100.0x the oracle price 108.61; wrong unit?"},{"label":"negative size","order":{"side":"buy","sizeUsd":-50,"price":108.61},"oracleAgeSec":3,"ok":false,"rule":"unit-sanity","reason":"size -50 USD is not a positive number"}]};
const PRICES={"generatedAt":"2026-10-21T17:53:59.000Z","mode":"recorded","pair":"SOL/USDC","venues":[{"id":"jupiter","label":"Jupiter quote","price":108.624648,"ts":1792605239,"source":"lite-api quote, 1 SOL -> USDC"},{"id":"pyth","label":"Pyth oracle","price":108.60542862,"confBps":2.68,"publishTime":1792605236,"postedSlot":459720770,"currentSlot":459720770,"source":"on-chain PriceUpdateV2 via RPC"},{"id":"orca","label":"Orca SOL/USDC pool","price":108.58645232409829,"ts":1792605239,"source":"whirlpool sqrtPrice via RPC"}],"gapBps":{"jupiterVsPyth":1.8,"orcaVsPyth":-1.7,"jupiterVsOrca":3.5}};
const ORA=PRICES.venues.find(v=>v.id==='pyth');
const RULE=id=>RISK.rules.find(r=>r.id===id)||{};
const DEF={mn:RULE('max-notional').limit,mg:RULE('max-oracle-gap').limit,ma:RULE('max-oracle-age').limit};
const el={mn:$('#mn'),mg:$('#mg'),ma:$('#ma')};
for(const k in el){el[k].value=hv(k,DEF[k]);el[k].addEventListener('input',render)}
const SHORT={'max-notional':'N','max-oracle-gap':'G','max-oracle-age':'A','unit-sanity':'U'};
/* the hook: same four rules as risk.json. Returns first failing rule (units first, then listed order) */
let LV=null; /* latest live snapshot, or null in Recorded mode */
const K=RISK.context||{},REC_ORACLE=K.oraclePrice??ORA.price;
/* Live: the oracle price and its age come from Pyth right now. The example orders keep their offset from the oracle (so
   "40 bps from oracle" is still 40 bps) and are re-priced to the live oracle; the order that is meant to have an old oracle keeps its age. */
function liveOrder(d){const o=d.order;return Object.assign({},d,{order:Object.assign({},o,{price:Math.round(o.price*LV.pyth/REC_ORACLE*100)/100})})}
function ctxOf(d){const c=Object.assign({},d.ctx,d.order&&d.order.ctx);
  const o=d.order;
  const oracle=LV?LV.pyth:(K.oraclePrice??ORA.price);
  const recAge=o.oracleAgeSec??d.oracleAgeSec??c.oracleAgeSec??K.oracleAgeSec??0;
  return {oracle,
   gapBps:o.oracleGapBps??c.oracleGapBps??Math.abs(bps(o.price,oracle)),
   ageSec:LV&&recAge<=10?LV.oracleAgeSec:recAge}}
function checkOrder(o,c,lim){
  const res={'unit-sanity':true,'max-notional':true,'max-oracle-gap':true,'max-oracle-age':true,why:{}};
  const ratio=o.price/c.oracle;
  if(!(o.sizeUsd>0)){res['unit-sanity']=false;res.why['unit-sanity']='size '+o.sizeUsd+' USD is not a positive number'}
  else if(!(o.price>0)||ratio>5||ratio<0.2){res['unit-sanity']=false;res.why['unit-sanity']='price '+o.price+' is '+f2(ratio,2)+'x the oracle ('+f2(c.oracle)+'): wrong units?'}
  if(o.sizeUsd>lim.mn){res['max-notional']=false;res.why['max-notional']=o.sizeUsd+' USD exceeds the '+lim.mn+' USD limit'}
  if(c.gapBps>lim.mg&&res['unit-sanity']){res['max-oracle-gap']=false;res.why['max-oracle-gap']='price is '+f2(c.gapBps,0)+' bps from oracle; limit '+lim.mg}
  if(c.ageSec>lim.ma){res['max-oracle-age']=false;res.why['max-oracle-age']='oracle is '+f2(c.ageSec,0)+' s old; limit '+lim.ma+' s'}
  const order=['unit-sanity',...RISK.rules.map(r=>r.id).filter(i=>i!=='unit-sanity')];
  const bad=order.find(r=>!res[r]);
  return {ok:!bad,rule:bad||null,reason:bad?res.why[bad]:'within all limits',res};
}
function render(){
  const lim={mn:+el.mn.value,mg:+el.mg.value,ma:+el.ma.value};
  $('#mno').textContent='$'+lim.mn;$('#mgo').textContent=lim.mg+' bps';$('#mao').textContent=lim.ma+' s';
  const O=$('#orders');O.innerHTML='';let acc=0,match=0;
  const atDef=lim.mn===DEF.mn&&lim.mg===DEF.mg&&lim.ma===DEF.ma;
  const items=LV?[{live:true,order:{side:'buy',sizeUsd:250,price:LV.jupiter}}].concat(RISK.decisions.map(liveOrder)):RISK.decisions;
  items.forEach(d=>{
    const o=d.order,c=ctxOf(d),r=checkOrder(o,c,lim);if(r.ok)acc++;
    if(!d.live&&r.ok===d.ok&&r.rule===d.rule)match++;
    const row=H('div',{class:'grid tr',style:'grid-template-columns:1.5fr 1.3fr 2.6fr;align-items:center;border:1.5px solid '+(d.live?'var(--mint)':r.ok?'var(--line-soft)':'var(--bad)')+';border-radius:.7rem;padding:0 .6rem'},O);
    const a=H('div',{class:'num',style:'font-size:1.05rem'},row);
    if(d.live)H('span',{class:'pill mint',style:'font-size:.8rem;margin-right:.4rem'},a,'LIVE');
    H('span',{class:o.side==='buy'?'mint':'lavc'},a,o.side.toUpperCase()+' ');a.append((o.sizeUsd<0?'-$'+Math.abs(o.sizeUsd):'$'+o.sizeUsd)+' @ '+f2(o.price));
    const g=H('div',{class:'row',style:'gap:.5rem'},row);
    ['max-notional','max-oracle-gap','max-oracle-age','unit-sanity'].forEach(id=>{
      H('span',{class:'pill '+(r.res[id]?'mint':'badc'),title:id,'aria-label':id+(r.res[id]?' pass':' fail')},g,SHORT[id]+(r.res[id]?'✓':'✗'))});
    const v=H('div',{},row);
    H('span',{class:'pill '+(r.ok?'mint':'badc'),style:'font-size:1rem;margin-right:.5rem'},v,r.ok?'ACCEPT':'REJECT');
    H('span',{class:r.ok?'mut':'',style:'font-size:.85rem'},v,r.ok?'within all limits':r.reason);
  });
  const n=items.length;
  $('#score').innerHTML='';
  H('div',{class:'big num'},$('#score'),acc+' accepted, '+(n-acc)+' rejected');
  H('div',{class:'mut',style:'font-size:.9rem'},$('#score'),LV?'Live: oracle $'+f2(LV.pyth)+', age '+LV.oracleAgeSec+' s, slot '+LV.slot.toLocaleString('en-US')+'. Top row: 250 USD at the live quote.':atDef?(match===n?'At the default limits this matches the recorded decisions ('+match+'/'+n+').':'At default limits: '+match+'/'+n+' match risk.json.'):'Limits changed: decisions recomputed live in the browser.');
}
const R=$('#rules');H('div',{class:'lab'},R,'Four rules');
RISK.rules.forEach(r=>{const d=H('div',{style:'font-size:.95rem;margin-top:.25rem'},R);H('span',{class:'lavc'},d,SHORT[r.id]+'  '+r.id);H('span',{class:'mut'},d,' '+r.description)});
function paintSrc(){LIVE.isLive()?LIVE.liveSource($('#src'),'Oracle price and age from Pyth; the live order uses the Jupiter quote. Decisions are computed in your browser. Orders are examples, not trades.'):
  sourceLine($('#src'),{prices:PRICES,risk:RISK},'Test orders and oracle reference from the recorded snapshot; decisions are computed in your browser. Orders are examples, not trades.',ORA.publishTime)}
render();paintSrc();
LIVE.startLive(snap=>{LV=snap;render();paintSrc()},{onMode:on=>{if(!on)LV=null;render();paintSrc()},recordedNote:'bundled data, captured '+(PRICES.generatedAt||'').slice(0,10)});
</script></body></html>
