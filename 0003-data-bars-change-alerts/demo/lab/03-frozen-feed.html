<script>const NS="http://www.w3.org/2000/svg";

function H(tag,attrs={},parent,text){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const HASH=new URLSearchParams(location.hash.slice(1));
const hv=(k,d)=>HASH.has(k)?HASH.get(k):d;

/* footer caption: says whether the data is recorded/live/fixture, its capture date, and what the page shows.
   opts.sim = extra sentence flagging a simulated element. */
function sourceLine(el,data,what,ts,opts={}){
  const vals=Object.values(data);
  const fx=vals.some(d=>d&&d.fixture);
  const d0=vals.find(d=>d.capturedAt||d.generatedAt)||vals[0];
  const mode=d0.mode||'recorded';
  const iso=(d0.capturedAt||d0.generatedAt||'');
  const when=iso?sgt(Date.parse(iso)/1000):(ts?sgt(ts):'date unknown');

  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.append((mode==='live'?'Live data':'Recorded data (not live)')+', captured '+when+'. ');
  a.append(what+' Public mainnet reads, no keys.');

  H('span',{style:'white-space:nowrap'},el,'Build night 2');
}
function tlab(t,span){const s=new Date((t+28800)*1000).toISOString();return span<600?s.slice(11,19):s.slice(11,16)}

<script>/* Pure calculation functions used by the demos (in the browser) and by verify.mjs (in Node). No dependencies. */
const CALC=(()=>{
  /* Time bars: one bar per clock bucket of `sec` seconds (epoch aligned). Empty buckets get no bar; they are counted. */
  function timeBars(swaps,sec){
    const m=new Map();
    for(const s of swaps){const k=Math.floor(s.t/sec);let b=m.get(k);
      if(!b){b={tStart:k*sec,tEnd:(k+1)*sec,open:s.price,high:s.price,low:s.price,close:s.price,volumeUsd:0,count:0};m.set(k,b)}
      b.high=Math.max(b.high,s.price);b.low=Math.min(b.low,s.price);b.close=s.price;b.volumeUsd+=s.usdcAmount;b.count++}
    const bars=[...m.entries()].sort((a,b)=>a[0]-b[0]).map(e=>e[1]);
    const first=Math.floor(swaps[0].t/sec),last=Math.floor(swaps[swaps.length-1].t/sec);
    return {bars,empty:(last-first+1)-bars.length};
  }
  /* Dollar bars: a bar closes on the swap that takes its dollars to the threshold or beyond (that swap stays in the bar).
     tStart = first swap time, tEnd = last swap time, durSec = tEnd - tStart. spanStart is for drawing only (previous close).
     The last bar may be unfinished (partial): it is kept so volumes add up, and flagged. */
  function dollarBars(swaps,thr){
    const bars=[];let cur=null,prevEnd=swaps[0].t;
    for(const s of swaps){
      if(!cur){cur={tStart:s.t,tEnd:s.t,open:s.price,high:s.price,low:s.price,close:s.price,volumeUsd:0,count:0,partial:false};bars.push(cur)}
      cur.high=Math.max(cur.high,s.price);cur.low=Math.min(cur.low,s.price);cur.close=s.price;cur.volumeUsd+=s.usdcAmount;cur.count++;cur.tEnd=s.t;
      if(cur.volumeUsd>=thr){cur=null}
    }
    bars.forEach((b,i)=>{b.spanStart=i===0?b.tStart:bars[i-1].tEnd;b.durSec=b.tEnd-b.tStart});
    if(bars.length&&bars[bars.length-1].volumeUsd<thr)bars[bars.length-1].partial=true;
    return {bars,partialLast:bars.length>0&&bars[bars.length-1].partial};
  }
  /* CUSUM: add up price changes in basis points. sPos only grows with up moves, sNeg only with down moves
     (each is floored at zero on its own side). When a bucket goes past the threshold an event fires; the row records the
     buckets as they were at that moment (full), and then BOTH buckets are emptied. */
  function cusum(series,thrBps){
    let sPos=0,sNeg=0;const out=[],events=[];
    for(let i=0;i<series.length;i++){
      if(i>0){const dp=(series[i].price/series[i-1].price-1)*1e4;sPos=Math.max(0,sPos+dp);sNeg=Math.min(0,sNeg+dp)}
      let fired=null;
      if(sPos>thrBps)fired='up';else if(sNeg<-thrBps)fired='down';
      out.push({t:series[i].t,price:series[i].price,sPos,sNeg,fired});
      if(fired){events.push({t:series[i].t,direction:fired,price:series[i].price,i});sPos=0;sNeg=0}
    }
    return {rows:out,events};
  }
  /* Staleness: age = now - publish time; slotsBehind = current slot - posted slot. Both limits must hold.
     A frozen feed (simulated) repeats the last value published before startT, while time and slots keep moving. */
  function staleness(points,maxAge,maxSlots,fault){
    let frozen=null;
    if(fault){for(const p of points){if(p.t<fault.startT)frozen=p;else break}}
    return points.map(p=>{
      let pub=p.publishTime,post=p.postedSlot,price=p.price;
      if(fault&&p.t>=fault.startT&&frozen){pub=frozen.publishTime;post=frozen.postedSlot;price=frozen.price}
      const age=Math.max(0,p.t-pub),behind=Math.max(0,p.currentSlot-post);
      return {t:p.t,currentSlot:p.currentSlot,postedSlot:post,publishTime:pub,price,ageSec:age,slotsBehind:behind,ok:age<=maxAge&&behind<=maxSlots};
    });
  }
  return {timeBars,dollarBars,cusum,staleness};
})();
if(typeof module!=='undefined')module.exports=CALC;
</script>
<script>/* Live mode: read-only public Solana data, straight from the browser. No keys, no wallets, no writes.
   Browser-safe RPC: solana-rpc.publicnode.com (api.mainnet.solana.com returns 403 for browser Origins). */
const LIVE=(()=>{
  const RPC=(typeof HASH!=='undefined'&&HASH.get('rpc'))||'https://solana-rpc.publicnode.com';
  const POOL='Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE',SOL_MINT='So11111111111111111111111111111111111111112',USDC_MINT='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
  const PYTH_ACCOUNT='7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE',PYTH_OWNER='rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ',PYTH_DISC='22f123639d7ef4cd';
  const A58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n>0n){s=A58[Number(n%58n)]+s;n/=58n}for(const x of b){if(x===0)s='1'+s;else break}return s}
  function fromB64(s){const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  const hex=(u,a,b)=>Array.from(u.slice(a,b),x=>x.toString(16).padStart(2,'0')).join('');
  let id=1;
  async function rpc(method,params){
    const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error){const e=new Error(j.error.message||'rpc error');e.rate=/429|rate|too many/i.test(JSON.stringify(j.error));throw e}
    return j.result;
  }
  async function account(addr){
    const r=await rpc('getAccountInfo',[addr,{encoding:'base64',commitment:'confirmed'}]);
    if(!r||!r.value)throw new Error('account not found');
    return {slot:r.context.slot,owner:r.value.owner,bytes:fromB64(r.value.data[0])};
  }
  /* Pyth SOL/USD PriceUpdateV2 account: price i64@73, conf i64@81, expo i32@89, publish time i64@93, posted slot u64@125 */
  async function fetchPythPrice(){
    const a=await account(PYTH_ACCOUNT);
    if(a.owner!==PYTH_OWNER)throw new Error('unexpected Pyth owner');
    const u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    if(u.length<133||hex(u,0,8)!==PYTH_DISC)throw new Error('not a Pyth price account');
    const expo=v.getInt32(89,true);
    return {price:Number(v.getBigInt64(73,true))*10**expo,publishTime:Number(v.getBigInt64(93,true)),postedSlot:Number(v.getBigUint64(125,true)),currentSlot:a.slot};
  }
  /* Orca whirlpool: sqrtPrice u128@65 (Q64.64); price = (sqrt/2^64)^2 * 10^(9-6) */
  async function fetchOrcaPrice(){
    const a=await account(POOL),u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    const sq=(v.getBigUint64(73,true)<<64n)|v.getBigUint64(65,true);
    const r=Number(sq)/2**64;return {price:r*r*1000,slot:a.slot};
  }
  async function fetchJupiterQuote(){
    const r=await fetch('https://lite-api.jup.ag/swap/v1/quote?inputMint='+SOL_MINT+'&outputMint='+USDC_MINT+'&amount=1000000000&slippageBps=50');
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();return {price:Number(j.outAmount)/1e6};
  }
  /* swaps: same rule as code/src/swaps.ts. A swap moves the two pool vaults in opposite directions. */
  let vaults=null;
  async function loadVaults(){
    if(vaults)return vaults;const a=await account(POOL),u=a.bytes;
    if(u.length<245||b58(u.slice(101,133))!==SOL_MINT||b58(u.slice(181,213))!==USDC_MINT)throw new Error('pool is not SOL/USDC');
    return vaults={sol:b58(u.slice(133,165)),usdc:b58(u.slice(213,245))};
  }
  function swapFromTx(sig,tx,vt){
    if(!tx||!tx.meta||tx.meta.err||tx.blockTime==null)return null;
    const keys=tx.transaction.message.accountKeys.map(k=>typeof k==='string'?k:k.pubkey);
    const d=(vault,mint)=>{const i=keys.indexOf(vault);if(i<0)return null;
      const f=l=>(l||[]).find(b=>b.accountIndex===i&&b.mint===mint),pre=f(tx.meta.preTokenBalances),post=f(tx.meta.postTokenBalances);
      return pre&&post?(Number(post.uiTokenAmount.amount)-Number(pre.uiTokenAmount.amount))/10**pre.uiTokenAmount.decimals:null};
    const ds=d(vt.sol,SOL_MINT),du=d(vt.usdc,USDC_MINT);
    if(ds===null||du===null||ds===0||du===0||Math.sign(ds)===Math.sign(du))return null;
    return {t:tx.blockTime,slot:tx.slot,side:ds>0?'sell':'buy',solAmount:Math.abs(ds),usdcAmount:Math.abs(du),price:Math.abs(du)/Math.abs(ds),sig};
  }
  /* state={lastSig:null}; returns new swaps oldest first (at most `max`), and the current slot */
  async function fetchNewSwaps(state,max=10){
    const vt=await loadVaults();
    const sigs=await rpc('getSignaturesForAddress',[POOL,Object.assign({limit:25,commitment:'confirmed'},state.lastSig?{until:state.lastSig}:{})]);
    if(sigs.length)state.lastSig=sigs[0].signature;
    const take=sigs.filter(s=>!s.err).slice(0,max).reverse(),out=[];
    for(const s of take){
      let tx=null;try{tx=await rpc('getTransaction',[s.signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:1,commitment:'confirmed'}])}catch(e){if(e.rate||!out.length&&s===take[take.length-1])throw e}
      const sw=swapFromTx(s.signature,tx,vt);if(sw)out.push(sw);
      await new Promise(r=>setTimeout(r,120));
    }
    return {swaps:out,slot:sigs.length?sigs[0].slot:null};
  }
  /* UI + loop. opts: {el, intervalMs=5000, enter(), exit(), poll(): Promise<{slot?,note?}> (throw on failure)} */
  function start(opts){
    const el=opts.el,every=opts.intervalMs||5000;
    el.innerHTML='';el.style.cssText='display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end';
    const grp=document.createElement('div');grp.setAttribute('role','group');grp.setAttribute('aria-label','Data source');grp.style.cssText='display:flex;gap:.4rem';
    const bR=document.createElement('button'),bL=document.createElement('button');bR.textContent='Recorded';bL.textContent='Live';
    bR.style.padding=bL.style.padding='.3rem .8rem';bR.style.fontSize=bL.style.fontSize='.95rem';
    grp.append(bR,bL);const pill=document.createElement('span');pill.className='pill';pill.style.fontSize='.85rem';pill.setAttribute('aria-live','polite');
    el.append(grp,pill);
    let on=false,timer=null,busy=false,gen=0,fails=0;
    const paint=()=>{bR.setAttribute('aria-pressed',on?'false':'true');bL.setAttribute('aria-pressed',on?'true':'false')};
    const say=(txt,cls)=>{pill.textContent=txt;pill.className='pill '+(cls||'mut');pill.style.fontSize='.85rem'};
    const hhmmss=()=>new Date(Date.now()+8*3600e3).toISOString().slice(11,19)+' SGT';
    async function tick(){
      if(!on||busy||document.hidden)return;busy=true;const g=gen;
      try{const r=await opts.poll()||{};if(g!==gen)return;fails=0;say('LIVE · '+hhmmss()+(r.slot?' · slot '+r.slot:'')+(r.note?' · '+r.note:''),'mint')}
      catch(e){if(g===gen){fails++;console.warn('live poll failed ('+fails+'/3):',e&&e.message);if(fails>=3)fallback(e);else say('LIVE · retrying ('+fails+'/3)','warnc')}}
      finally{busy=false}
    }
    function setLive(v){
      if(v===on)return;on=v;gen++;fails=0;paint();clearInterval(timer);timer=null;
      if(on){say('LIVE · connecting','warnc');opts.enter();tick();timer=setInterval(tick,every)}
      else{opts.exit();say('Recorded data','mut')}
    }
    function fallback(e){on=false;gen++;paint();clearInterval(timer);timer=null;opts.exit();say((e&&e.rate?'rate limited, back to recorded':'live unavailable, back to recorded'),'badc');console.warn('live mode failed:',e&&e.message)}
    bR.addEventListener('click',()=>setLive(false));bL.addEventListener('click',()=>setLive(true));
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
    paint();say('Recorded data','mut');
    if(/[?&#]live=1/.test(location.search+location.hash))setLive(true);
    return {isLive:()=>on};
  }
  return {fetchPythPrice,fetchOrcaPrice,fetchJupiterQuote,fetchNewSwaps,start,rpc};
})();
if(typeof module!=='undefined')module.exports=LIVE;
