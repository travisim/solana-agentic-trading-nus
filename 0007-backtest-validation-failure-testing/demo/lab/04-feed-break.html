<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>/* Shared look: Workshop 1 deck (black, lavender, mint, thin-outline rounded boxes). No libraries, no web fonts. */

</style></head><body>
<div class="page">
<div class="row" style="align-items:flex-start;justify-content:space-between"><h1>A broken feed raises an alarm</h1><div id="livebar" class="lvwrap"></div></div>
<p class="cap">A healthy oracle keeps a steady gap to the venue price. A freeze makes the gap drift and the sums cross the line.</p>
<main id="main" aria-label="Structural break alarm on the oracle gap">
<div class="box" style="display:grid;grid-template-columns:repeat(4,1fr) auto;gap:1.4rem;align-items:center;padding:.4rem 1.1rem">
  <div class="ctl" style="grid-template-columns:1fr 4rem;gap:.05rem .6rem"><label for="hh" style="grid-column:1/-1;font-size:1rem">Alarm level h</label><input id="hh" type="range" min="1" max="15" step="0.5" aria-label="Alarm level in standard deviations"><output id="hho" for="hh"></output></div>
  <div class="ctl" style="grid-template-columns:1fr 4rem;gap:.05rem .6rem"><label for="kk" style="grid-column:1/-1;font-size:1rem">Slack k</label><input id="kk" type="range" min="0" max="2" step="0.1" aria-label="Slack in standard deviations"><output id="kko" for="kk"></output></div>
  <div class="ctl" style="grid-template-columns:1fr 6.2rem;gap:.05rem .6rem"><label for="mm" style="grid-column:1/-1;font-size:1rem">Market move after the freeze</label><input id="mm" type="range" min="-10" max="10" step="1" aria-label="Extra market move after the freeze, basis points per minute"><output id="mmo" for="mm"></output></div>
  <div class="ctl" style="grid-template-columns:1fr 5rem;gap:.05rem .6rem"><label for="fz" style="grid-column:1/-1;font-size:1rem">Freeze starts at</label><input id="fz" type="range" min="70" max="460" step="2" aria-label="Sample at which the oracle freezes"><output id="fzo" for="fz"></output></div>
  <button id="inj" aria-pressed="false" style="white-space:nowrap">Freeze the oracle (simulated)</button>
</div>
<div class="grid" style="grid-template-columns:2.1fr 1fr;flex:1;min-height:0;gap:.8rem">
  <div class="grid" style="grid-template-rows:1.25fr 1fr;gap:.8rem;min-height:0">
    <div class="box" style="padding:.3rem .8rem .1rem;display:flex;flex-direction:column;min-height:0"><svg id="c1" viewBox="0 0 1000 290" role="img" aria-label="Gap between the venue price and the oracle price in basis points"></svg><div class="key" id="key"></div></div>
    <div class="box" style="padding:.3rem .8rem .1rem"><svg id="c2" viewBox="0 0 1000 215" role="img" aria-label="The two running sums against the alarm level"></svg></div>
  </div>
  <div class="grid" style="grid-template-rows:auto 1fr;gap:.8rem;min-height:0"><div class="box" id="read" aria-live="polite"></div><div class="box" id="side"></div></div>
</div>
<div id="chk" class="mut" style="font-size:.85rem"></div>
</main>
<div class="src" id="src"></div>
</div>
<script>const NS="http://www.w3.org/2000/svg";

   opts.sim = extra sentence flagging a simulated element. */
function sourceLine(el,data,what,ts,opts={}){
  const vals=Object.values(data);
  const fx=vals.some(d=>d&&d.fixture);
  const d0=vals.find(d=>d.capturedAt||d.generatedAt)||vals[0];
  const mode=d0.mode||'recorded';
  const iso=(d0.capturedAt||d0.generatedAt||'');
  const when=iso?sgt(Date.parse(iso)/1000):(ts?sgt(ts):'date unknown');
  el.innerHTML='';
  const a=H('span',{},el);
  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.append((mode==='live'?'Live data':'Recorded data (not live)')+', captured '+when+'. ');
  a.append(what+' Public mainnet reads, no keys.');
  if(opts.sim)H('span',{class:'fx'},a,' '+opts.sim);

}
function tlab(t,span){const s=new Date((t+28800)*1000).toISOString();return span<600?s.slice(11,19):s.slice(11,16)}
/* Live strip (demos 1 and 2): one real Pyth read plus one Orca read every poll; shown only while Live is on.
   It is NOT part of the simulation. Returns {update(r), show(on)}. */
function mountLiveStrip(el){
  el.style.display='none';el.setAttribute('aria-live','polite');
  return {
    show(on){el.style.display=on?'block':'none';if(!on)el.innerHTML=''},
    update(r){
      el.innerHTML='';
      const row=H('div',{class:'row',style:'gap:1.6rem;flex-wrap:wrap;align-items:baseline'},el);
      H('span',{class:'pill mint',style:'font-size:.85rem'},row,'LIVE, not part of the simulation');
      H('span',{class:'num'},row,'Pyth $'+f2(r.pyth,3)+' ('+r.ageSec+' s old, '+r.slotsBehind+' slots behind)');
      H('span',{class:'num'},row,'Orca pool $'+f2(r.orca,3));
      H('span',{class:'num '+(Math.abs(r.gapBps)>r.costBps?'warnc':'mint')},row,'gap '+f2(r.gapBps,1)+' bps vs cost line '+r.costBps+' bps');
      H('span',{class:'mut',style:'font-size:.9rem'},row,r.note);
    }
  };

async function liveSnapshot(){
  const [p,o]=await Promise.all([LIVE.fetchPythPrice(),LIVE.fetchOrcaPrice()]);
  const now=Math.floor(Date.now()/1000);
  return {pyth:p.price,publishTime:p.publishTime,ageSec:Math.max(0,now-p.publishTime),slotsBehind:p.currentSlot-p.postedSlot,slot:p.currentSlot,orca:o.price,gapBps:(o.price/p.price-1)*1e4,t:now};
}

<script>/* Demo maths for build night 4. This file is inlined into every demo AND run by verify.mjs against ../code/out/*.json.

const CALC=(()=>{

  const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};

      c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
      d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416],lo=0.02425;
    let q,r;
    if(p<lo){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
    if(p>1-lo)return -normInv(1-p);
    q=p-.5;r=q*q;
    return ((((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q)/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }
  const MIN_TRADES=4,G=0.5772156649015329;
  /* src/stats.ts sharpeLike */
  function sharpeLike(nets){if(nets.length<MIN_TRADES)return null;const s=sd(nets);return s===0?null:mean(nets)/s}
  /* src/stats.ts luckBenchmark */
  function luckBenchmark(n,variance){if(n<2||variance<=0)return 0;return Math.sqrt(variance)*((1-G)*normInv(1-1/n)+G*normInv(1-1/(n*Math.E)))}
  /* src/overfit.ts: trades -> scores at a cost (bps per leg, fee + slippage together). notional 1000 USD per trade. */
  function net(t,costBps,trade){return trade-t.legs*(costBps/1e4)*1000}
  function trialScores(t,costBps){
    const is=t.is.map(g=>net(t,costBps,g)),oos=t.oos.map(g=>net(t,costBps,g));
    return {is:sharpeLike(is),oos:sharpeLike(oos),isTrades:is.length,oosTrades:oos.length,isNet:is.reduce((a,b)=>a+b,0),oosNet:oos.reduce((a,b)=>a+b,0)};
  }
  /* src/overfit.ts bestOfFirst */
  function bestOfFirst(S,n){ /* S = array of trialScores for one draw */
    const first=S.slice(0,n),idx=[];first.forEach((s,i)=>{if(s.is!==null)idx.push(i)});
    if(!idx.length)return {n,best:-1,bestScore:null,benchmark:0,deflated:null,scoredCount:0};
    let b=idx[0];for(const i of idx)if(first[i].is>first[b].is)b=i;
    const sc=idx.map(i=>first[i].is),bench=luckBenchmark(n,sc.length>1?sd(sc)**2:0);
    return {n,best:b,bestScore:first[b].is,benchmark:bench,deflated:first[b].is-bench,scoredCount:sc.length};
  }
  /* src/overfit.ts runSeed: rank of the in-sample winner among all scored out-of-sample scores */
  function drawSummary(trials,costBps,n){
    const S=trials.map(t=>trialScores(t,costBps)),b=bestOfFirst(S,n);
    const ranked=S.map((s,i)=>({s,i})).filter(x=>x.s.oos!==null).sort((a,c)=>c.s.oos-a.s.oos);
    const rk=b.best>=0?ranked.findIndex(x=>x.i===b.best):-1;

  /* src/splits.ts assignFolds + purgedKFold. Returns per-fold role arrays. */
  function assignFolds(m,k,mode,seed){

  /* role per sample: 'unused' (no label), 'test', 'train', 'purged', 'embargo' */
  function purgedKFold(n,o){
    const first=o.first==null?24:o.first,moments=[];for(let i=first;i+o.h<n;i++)moments.push(i);

  const LIMITS={maxNotionalUsd:1000,maxOracleGapBps:50,maxOracleAgeSec:60};
  function checkOrder(order,ctx,L){
    L=L||LIMITS;const no=(rule,reason)=>({ok:false,rule,reason}),{sizeUsd,price}=order;

    if(!Number.isFinite(price)||price<=0)return no('unit-sanity','price '+price+' is not a positive number');
    if(!Number.isFinite(ctx.oraclePrice)||ctx.oraclePrice<=0)return no('unit-sanity','oracle price is missing or not positive');
    const ratio=price/ctx.oraclePrice;if(ratio>5||ratio<0.2)return no('unit-sanity','price is '+ratio.toFixed(1)+'x the oracle price; wrong unit?');
    if(ctx.oracleAgeSec>L.maxOracleAgeSec)return no('max-oracle-age','oracle is '+ctx.oracleAgeSec+' s old, limit is '+L.maxOracleAgeSec+' s');
    if(sizeUsd>L.maxNotionalUsd)return no('max-notional',sizeUsd+' USD exceeds the '+L.maxNotionalUsd+' USD limit');
    const gap=Math.abs(price-ctx.oraclePrice)/ctx.oraclePrice*1e4;
    if(gap>L.maxOracleGapBps)return no('max-oracle-gap','price is '+gap.toFixed(1)+' bps from the oracle, limit is '+L.maxOracleGapBps+' bps');
    return {ok:true,rule:null,reason:'within all limits'};
  }
  /* src/faults.ts replayFault */
  const F={ORDER_EVERY:6,ORDER_SIZE_USD:250,BASE_FEE_BPS:5,BAD_FILL_BPS:20,SLIPPAGE_BUDGET_BPS:15,BREAKER_MAX_BREACHES:3,TICK_SEC:5};
  function replayFault(pts,p,baseAgeSec,guards,limits){
    guards=guards||{dedupe:false,breaker:false};const recs=[],seen=new Set();let breaches=0,halted=false;const end=p.startTick+p.durationTicks;
    for(let i=F.ORDER_EVERY;i<pts.length;i+=F.ORDER_EVERY){
      const win=p.kind!=='none'&&i>=p.startTick&&i<end,side=(i/F.ORDER_EVERY)%2===1?'buy':'sell';
      const shock=win&&(p.kind==='stale-oracle'||p.kind==='rpc-outage')?1+p.shockBps/1e4:1,market=pts[i].jupiter*shock,lastGood=Math.max(0,p.startTick-1);
      const frozen=win&&(p.kind==='stale-oracle'||p.kind==='rpc-outage');
      const oraclePrice=frozen?pts[lastGood].pyth:pts[i].pyth,oracleAgeSec=frozen?baseAgeSec+(i-p.startTick+1)*F.TICK_SEC:baseAgeSec;

      }

  function summarizeWindow(recs){
    const w=recs.filter(r=>r.inWindow),byRule={};for(const r of w)if(!r.ok)byRule[r.rule||'unknown']=(byRule[r.rule||'unknown']||0)+1;
    const acc=w.filter(r=>r.ok),rej=w.filter(r=>!r.ok);

const PTS=FD.series;

}
