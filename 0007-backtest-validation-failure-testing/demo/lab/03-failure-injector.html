<style>/* Shared look: Workshop 1 deck (black, lavender, mint, thin-outline rounded boxes). No libraries, no web fonts. */

<div class="page">
<div class="row" style="align-items:flex-start;justify-content:space-between"><h1>Break it on purpose</h1><div id="livebar" class="lvwrap"></div></div>
<p class="cap">One order every 30 seconds goes through the build-night-1 risk hook. Pick a fault and see what the hook catches and what it cannot.</p>
<div id="liveStrip" class="box" style="padding:.35rem .9rem"></div>
<main id="main" aria-label="Failure injection demo for the risk hook">
<div class="box" style="display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.4rem;align-items:center;padding:.4rem 1.1rem">

  <div style="display:grid;grid-template-columns:repeat(5,1fr) 12rem;gap:1rem;align-items:center">
    <div class="ctl" id="cLen" style="grid-template-columns:1fr 3.6rem;gap:.05rem .5rem"><label for="len" style="grid-column:1/-1;font-size:.9rem">Fault length</label><input id="len" type="range" min="1" max="10" step="1" aria-label="Fault length in minutes"><output id="leno" for="len" style="font-size:.9rem"></output></div>
    <div class="ctl" id="cMv" style="grid-template-columns:1fr 4rem;gap:.05rem .5rem"><label for="mv" style="grid-column:1/-1;font-size:.9rem">Market move</label><input id="mv" type="range" min="-200" max="200" step="10" aria-label="Market move during the fault in basis points"><output id="mvo" for="mv" style="font-size:.9rem"></output></div>
    <div class="ctl" id="cSl" style="grid-template-columns:1fr 4rem;gap:.05rem .5rem"><label for="sl" style="grid-column:1/-1;font-size:.9rem">Slippage per fill</label><input id="sl" type="range" min="0" max="100" step="5" aria-label="Slippage per fill in basis points"><output id="slo" for="sl" style="font-size:.9rem"></output></div>
    <div class="ctl" id="cFe" style="grid-template-columns:1fr 4rem;gap:.05rem .5rem"><label for="fe" style="grid-column:1/-1;font-size:.9rem">Fee per leg</label><input id="fe" type="range" min="5" max="60" step="5" aria-label="Fee per leg in basis points"><output id="feo" for="fe" style="font-size:.9rem"></output></div>

  </div>
</div>
<div class="grid" style="grid-template-columns:2fr 1fr;flex:1;min-height:0;gap:.8rem">
  <div class="grid" style="grid-template-rows:1.7fr 1fr;gap:.8rem;min-height:0">
    <div class="box" style="padding:.3rem .8rem .1rem;display:flex;flex-direction:column;min-height:0"><svg id="c1" viewBox="0 0 1000 330" role="img" aria-label="Market price, oracle price and each order with the hook's decision"></svg><div class="key" id="key"></div></div>

  </div>

</main>

</div>
<script>const NS="http://www.w3.org/2000/svg";
const $=(s,r=document)=>r.querySelector(s);
function S(tag,attrs={},parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function H(tag,attrs={},parent,text){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const HASH=new URLSearchParams(location.hash.slice(1));
const hv=(k,d)=>HASH.has(k)?HASH.get(k):d;
const bps=(a,b)=>(a/b-1)*1e4;
const f2=(x,n=2)=>Number(x).toFixed(n);
function dateOf(sec){return new Date(sec*1000).toISOString().replace('T',' ').slice(0,16)+' UTC'}
const sgt=sec=>new Date((sec+8*3600)*1000).toISOString().replace('T',' ').slice(0,16)+' SGT';
/* footer caption: says whether the data is recorded/live/fixture, its capture date, and what the page shows.
   opts.sim = extra sentence flagging a simulated element. */
function sourceLine(el,data,what,ts,opts={}){
  const vals=Object.values(data);
  const fx=vals.some(d=>d&&d.fixture);
  const d0=vals.find(d=>d.capturedAt||d.generatedAt)||vals[0];
  const mode=d0.mode||'recorded';
  const iso=(d0.capturedAt||d0.generatedAt||'');
  const when=iso?sgt(Date.parse(iso)/1000):(ts?sgt(ts):'date unknown');
  el.innerHTML='';
  const a=H('span',{},el);
  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.append((mode==='live'?'Live data':'Recorded data (not live)')+', captured '+when+'. ');
  a.append(what+' Public mainnet reads, no keys.');
  if(opts.sim)H('span',{class:'fx'},a,' '+opts.sim);
  H('span',{style:'white-space:nowrap'},el,'Build night 4');
}
function tlab(t,span){const s=new Date((t+28800)*1000).toISOString();return span<600?s.slice(11,19):s.slice(11,16)}
/* Live strip (demos 1 and 2): one real Pyth read plus one Orca read every poll; shown only while Live is on.
   It is NOT part of the simulation. Returns {update(r), show(on)}. */
function mountLiveStrip(el){
  el.style.display='none';el.setAttribute('aria-live','polite');
  return {
    show(on){el.style.display=on?'block':'none';if(!on)el.innerHTML=''},
    update(r){
      el.innerHTML='';
      const row=H('div',{class:'row',style:'gap:1.6rem;flex-wrap:wrap;align-items:baseline'},el);
      H('span',{class:'pill mint',style:'font-size:.85rem'},row,'LIVE, not part of the simulation');
      H('span',{class:'num'},row,'Pyth $'+f2(r.pyth,3)+' ('+r.ageSec+' s old, '+r.slotsBehind+' slots behind)');
      H('span',{class:'num'},row,'Orca pool $'+f2(r.orca,3));
      H('span',{class:'num '+(Math.abs(r.gapBps)>r.costBps?'warnc':'mint')},row,'gap '+f2(r.gapBps,1)+' bps vs cost line '+r.costBps+' bps');
      H('span',{class:'mut',style:'font-size:.9rem'},row,r.note);
    }
  };
}
async function liveSnapshot(){
  const [p,o]=await Promise.all([LIVE.fetchPythPrice(),LIVE.fetchOrcaPrice()]);
  const now=Math.floor(Date.now()/1000);
  return {pyth:p.price,publishTime:p.publishTime,ageSec:Math.max(0,now-p.publishTime),slotsBehind:p.currentSlot-p.postedSlot,slot:p.currentSlot,orca:o.price,gapBps:(o.price/p.price-1)*1e4,t:now};
}
</script>
<script>/* Demo maths for build night 4. This file is inlined into every demo AND run by verify.mjs against ../code/out/*.json.
   Each function mirrors a function in ../code/src (named in the comment). Plain JavaScript, no dependencies. */
const CALC=(()=>{
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
  const round=(x,d=4)=>Math.round(x*10**d)/10**d;
  /* src/stats.ts normInv */
  function normInv(p){
    if(p<=0)return -Infinity;if(p>=1)return Infinity;
    const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
      b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
      c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
      d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416],lo=0.02425;
    let q,r;
    if(p<lo){q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
    if(p>1-lo)return -normInv(1-p);
    q=p-.5;r=q*q;
    return ((((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q)/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
  }
  const MIN_TRADES=4,G=0.5772156649015329;
  /* src/stats.ts sharpeLike */
  function sharpeLike(nets){if(nets.length<MIN_TRADES)return null;const s=sd(nets);return s===0?null:mean(nets)/s}
  /* src/stats.ts luckBenchmark */
  function luckBenchmark(n,variance){if(n<2||variance<=0)return 0;return Math.sqrt(variance)*((1-G)*normInv(1-1/n)+G*normInv(1-1/(n*Math.E)))}
  /* src/overfit.ts: trades -> scores at a cost (bps per leg, fee + slippage together). notional 1000 USD per trade. */
  function net(t,costBps,trade){return trade-t.legs*(costBps/1e4)*1000}
  function trialScores(t,costBps){
    const is=t.is.map(g=>net(t,costBps,g)),oos=t.oos.map(g=>net(t,costBps,g));
    return {is:sharpeLike(is),oos:sharpeLike(oos),isTrades:is.length,oosTrades:oos.length,isNet:is.reduce((a,b)=>a+b,0),oosNet:oos.reduce((a,b)=>a+b,0)};
  }
  /* src/overfit.ts bestOfFirst */
  function bestOfFirst(S,n){ /* S = array of trialScores for one draw */
    const first=S.slice(0,n),idx=[];first.forEach((s,i)=>{if(s.is!==null)idx.push(i)});
    if(!idx.length)return {n,best:-1,bestScore:null,benchmark:0,deflated:null,scoredCount:0};
    let b=idx[0];for(const i of idx)if(first[i].is>first[b].is)b=i;
    const sc=idx.map(i=>first[i].is),bench=luckBenchmark(n,sc.length>1?sd(sc)**2:0);
    return {n,best:b,bestScore:first[b].is,benchmark:bench,deflated:first[b].is-bench,scoredCount:sc.length};
  }
  /* src/overfit.ts runSeed: rank of the in-sample winner among all scored out-of-sample scores */
  function drawSummary(trials,costBps,n){
    const S=trials.map(t=>trialScores(t,costBps)),b=bestOfFirst(S,n);
    const ranked=S.map((s,i)=>({s,i})).filter(x=>x.s.oos!==null).sort((a,c)=>c.s.oos-a.s.oos);
    const rk=b.best>=0?ranked.findIndex(x=>x.i===b.best):-1;
    return Object.assign(b,{S,oosRank:rk>=0?rk+1:null,oosScored:ranked.length});
  }
  /* src/splits.ts assignFolds + purgedKFold. Returns per-fold role arrays. */
  function assignFolds(m,k,mode,seed){
    if(mode==='contiguous')return Array.from({length:m},(_,j)=>Math.min(k-1,Math.floor(j*k/m)));
    let a=(seed>>>0);const next=()=>{a=(a+0x6d2b79f5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
    return Array.from({length:m},()=>Math.min(k-1,Math.floor(next()*k)));
  }
  /* role per sample: 'unused' (no label), 'test', 'train', 'purged', 'embargo' */
  function purgedKFold(n,o){
    const first=o.first==null?24:o.first,moments=[];for(let i=first;i+o.h<n;i++)moments.push(i);
    const fold=assignFolds(moments.length,o.k,o.mode,o.seed==null?12345:o.seed),out=[];
    for(let f=0;f<o.k;f++){
      const test=moments.filter((_,j)=>fold[j]===f);if(!test.length)continue;
      const leak=new Uint8Array(n+1),emb=new Uint8Array(n+1),isTest=new Uint8Array(n+1);
      for(const i of test){isTest[i]=1;for(let j=Math.max(0,i-o.h);j<=Math.min(n-1,i+o.h);j++)leak[j]=1;
        if(o.embargo>0)for(let j=i+o.h+1;j<=Math.min(n-1,i+o.h+o.embargo);j++)emb[j]=1}
      const role=new Array(n).fill('unused');let kept=0,purged=0,embargoed=0,leaking=0;
      for(const i of test)role[i]='test';
      for(const j of moments){if(isTest[j])continue;
        if(leak[j])leaking++;
        if(o.purge&&leak[j]){purged++;role[j]='purged'}
        else if(emb[j]){embargoed++;role[j]='embargo'}
        else{kept++;role[j]='train'}}
      out.push({fold:f,role,test:test.length,kept,purged,embargoed,leaking,testFirst:test[0],testLast:test[test.length-1]});
    }
    return out;
  }
  function foldAverages(n,o){const fs=purgedKFold(n,o),m=Math.max(1,fs.length),s=k=>fs.reduce((a,f)=>a+f[k],0)/m;return {trainKept:s('kept'),purged:s('purged'),embargoed:s('embargoed'),leaking:s('leaking')}}
  /* src/risk.ts checkOrder (the build-night-1 risk hook) */
  const LIMITS={maxNotionalUsd:1000,maxOracleGapBps:50,maxOracleAgeSec:60};
  function checkOrder(order,ctx,L){
    L=L||LIMITS;const no=(rule,reason)=>({ok:false,rule,reason}),{sizeUsd,price}=order;
    if(order.side!=='buy'&&order.side!=='sell')return no('unit-sanity','side '+order.side+' is not buy or sell');
    if(!Number.isFinite(sizeUsd)||sizeUsd<=0)return no('unit-sanity','size '+sizeUsd+' USD is not a positive number');
    if(!Number.isFinite(price)||price<=0)return no('unit-sanity','price '+price+' is not a positive number');
    if(!Number.isFinite(ctx.oraclePrice)||ctx.oraclePrice<=0)return no('unit-sanity','oracle price is missing or not positive');
    const ratio=price/ctx.oraclePrice;if(ratio>5||ratio<0.2)return no('unit-sanity','price is '+ratio.toFixed(1)+'x the oracle price; wrong unit?');
    if(ctx.oracleAgeSec>L.maxOracleAgeSec)return no('max-oracle-age','oracle is '+ctx.oracleAgeSec+' s old, limit is '+L.maxOracleAgeSec+' s');
    if(sizeUsd>L.maxNotionalUsd)return no('max-notional',sizeUsd+' USD exceeds the '+L.maxNotionalUsd+' USD limit');
    const gap=Math.abs(price-ctx.oraclePrice)/ctx.oraclePrice*1e4;
    if(gap>L.maxOracleGapBps)return no('max-oracle-gap','price is '+gap.toFixed(1)+' bps from the oracle, limit is '+L.maxOracleGapBps+' bps');
    return {ok:true,rule:null,reason:'within all limits'};
  }
  /* src/faults.ts replayFault */
  const F={ORDER_EVERY:6,ORDER_SIZE_USD:250,BASE_FEE_BPS:5,BAD_FILL_BPS:20,SLIPPAGE_BUDGET_BPS:15,BREAKER_MAX_BREACHES:3,TICK_SEC:5};
  function replayFault(pts,p,baseAgeSec,guards,limits){
    guards=guards||{dedupe:false,breaker:false};const recs=[],seen=new Set();let breaches=0,halted=false;const end=p.startTick+p.durationTicks;
    for(let i=F.ORDER_EVERY;i<pts.length;i+=F.ORDER_EVERY){
      const win=p.kind!=='none'&&i>=p.startTick&&i<end,side=(i/F.ORDER_EVERY)%2===1?'buy':'sell';
      const shock=win&&(p.kind==='stale-oracle'||p.kind==='rpc-outage')?1+p.shockBps/1e4:1,market=pts[i].jupiter*shock,lastGood=Math.max(0,p.startTick-1);
      const frozen=win&&(p.kind==='stale-oracle'||p.kind==='rpc-outage');
      const oraclePrice=frozen?pts[lastGood].pyth:pts[i].pyth,oracleAgeSec=frozen?baseAgeSec+(i-p.startTick+1)*F.TICK_SEC:baseAgeSec;
      const orderPrice=win&&p.kind==='rpc-outage'?pts[lastGood].jupiter:win&&p.kind==='stale-oracle'?oraclePrice:market;
      const order={side,sizeUsd:F.ORDER_SIZE_USD,price:round(orderPrice,4)},copies=win&&p.kind==='duplicate-submission'?2:1;
      for(let c=1;c<=copies;c++){
        const d=checkOrder(order,{oraclePrice,oracleAgeSec},limits);let ok=d.ok,rule=d.rule,reason=d.reason;
        if(ok&&guards.dedupe){const key=side+'|'+order.sizeUsd+'|'+Math.floor(i/F.ORDER_EVERY);if(seen.has(key)){ok=false;rule='duplicate-order';reason='same order already sent in this 30 s slot'}else seen.add(key)}
        if(ok&&guards.breaker&&halted){ok=false;rule='circuit-breaker';reason='halted after '+F.BREAKER_MAX_BREACHES+' fills worse than '+F.SLIPPAGE_BUDGET_BPS+' bps'}
        let adv=side==='buy'?Math.max(0,(order.price/market-1)*1e4):Math.max(0,(1-order.price/market)*1e4);
        if(win&&p.kind==='slippage-shock')adv+=p.slipBps;

  $('#leno').textContent=len.value+' min';$('#mvo').textContent=(+mv.value>0?'+':'')+mv.value+' bps';$('#slo').textContent=sl.value+' bps';$('#feo').textContent=fe.value+' bps';$('#ago').textContent=ag.value+' s';
  $('#gd').setAttribute('aria-pressed',guards);$('#gd').textContent='Extra guards: '+(guards?'on':'off');
  fb.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===kind));
  for(const id of ['cLen','cMv','cSl','cFe','cAg'])$('#'+id).classList.toggle('off',!R.USE[kind].includes(id));
  const {p,lim,out}=run(guards),W=out.inWindow,none=run(false).out.inWindow;
  const x0=Math.max(0,p.startTick-24),x1=Math.min(NP-1,p.startTick+p.durationTicks+24),X=i=>60+930*(i-x0)/(x1-x0);
  const frozen=kind==='stale-oracle'||kind==='rpc-outage';
  const mk=i=>{const w=i>=p.startTick&&i<p.startTick+p.durationTicks;return PTS[i].jupiter*(w&&frozen?1+p.shockBps/1e4:1)};
  const orc=i=>{const w=i>=p.startTick&&i<p.startTick+p.durationTicks;return w&&frozen?PTS[Math.max(0,p.startTick-1)].pyth:PTS[i].pyth};
  const rs=out.records.filter(r=>r.tick>=x0&&r.tick<=x1);
  const vals=[];for(let i=x0;i<=x1;i++){vals.push(mk(i),orc(i))}rs.forEach(r=>vals.push(r.order.price));
  let lo=Math.min(...vals),hi=Math.max(...vals);const pd=(hi-lo)*.12||.05;lo-=pd;hi+=pd;const Y=v=>30+185*(1-(v-lo)/(hi-lo));
  const c1=$('#c1');c1.innerHTML='';
  S('text',{x:60,y:16,'font-size':18,class:'l'},c1,'Price (USD per SOL) and the agent\'s orders. Shaded: the injected fault ('+LABEL[kind]+', simulated)');
  S('rect',{x:X(p.startTick),y:24,width:X(Math.min(NP-1,p.startTick+p.durationTicks))-X(p.startTick),height:196,fill:BAD,'fill-opacity':.09,stroke:'#4a4670','stroke-dasharray':'4 4'},c1);
  for(const v of [lo+pd,hi-pd])S('text',{x:54,y:Y(v)+5,'text-anchor':'end','font-size':16,class:'m'},c1,f2(v,2));
  const poly=(f,col,dash,w)=>{let pts=[];for(let i=x0;i<=x1;i++)pts.push(X(i).toFixed(1)+','+Y(f(i)).toFixed(1));S('polyline',{points:pts.join(' '),fill:'none',stroke:col,'stroke-width':w||2,'stroke-dasharray':dash||''},c1)};
  poly(mk,'#8a8a94',null,2);poly(orc,LAV,'6 4',2);
  /* order lane */
  S('text',{x:60,y:248,'font-size':16,class:'m'},c1,'orders (one every 30 s): the hook\'s decision');
  rs.forEach(r=>{const cx=X(r.tick)+(r.copy===2?5:0),cy=Y(r.order.price);
    S('circle',{cx,cy,r:4,fill:'#f4f4f6'},c1);
    const ly=268+(r.copy===2?18:0);
    if(r.ok){S('circle',{cx,cy:ly,r:8,fill:OK,'fill-opacity':.9},c1);if(r.adverseBps>FD.badFillBps)S('circle',{cx,cy:ly,r:13,fill:'none',stroke:HI,'stroke-width':2.4},c1)}
    else{S('path',{d:`M${cx-7} ${ly-7}L${cx+7} ${ly+7}M${cx+7} ${ly-7}L${cx-7} ${ly+7}`,stroke:BAD,'stroke-width':3},c1)}
  });
  const firstRej=rs.find(r=>!r.ok);
  if(firstRej)S('text',{x:Math.min(X(firstRej.tick),760),y:306,'font-size':16,style:'fill:'+BAD},c1,'first rejection: '+firstRej.rule);
  for(let k=0;k<=4;k++){const i=Math.round(x0+(x1-x0)*k/4);S('text',{x:X(i),y:326,'text-anchor':k===0?'start':k===4?'end':'middle','font-size':15,class:'m'},c1,sgt(PTS[i].t).slice(11,16));}
  const key=$('#key');key.innerHTML='';
  [[OK,'accepted'],[BAD,'rejected (x)'],[HI,'bad fill, over '+FD.badFillBps+' bps (ring)'],['#8a8a94','market'],[LAV,'oracle the agent sees (dashed)']].forEach(([c,t])=>{const s=H('span',{},key);H('i',{style:'background:'+c},s);s.append(t)});
  /* age chart */
  const c2=$('#c2');c2.innerHTML='';
  const age=i=>{const w=i>=p.startTick&&i<p.startTick+p.durationTicks;return w&&frozen?FD.baseAgeSec+(i-p.startTick+1)*5:FD.baseAgeSec};
  let amx=0;for(let i=x0;i<=x1;i++)amx=Math.max(amx,age(i));const am=Math.max(lim.maxOracleAgeSec*1.4,amx),AY=v=>26+105*(1-Math.sqrt(Math.min(v,am)/am));
  S('text',{x:60,y:16,'font-size':18,class:'l'},c2,'Oracle age in seconds (square-root scale) against the hook\'s limit ('+lim.maxOracleAgeSec+' s)');
  S('rect',{x:X(p.startTick),y:22,width:X(Math.min(NP-1,p.startTick+p.durationTicks))-X(p.startTick),height:112,fill:BAD,'fill-opacity':.09},c2);
  let ap=[];for(let i=x0;i<=x1;i++)ap.push(X(i).toFixed(1)+','+AY(age(i)).toFixed(1));S('polyline',{points:ap.join(' '),fill:'none',stroke:OK,'stroke-width':2.6},c2);
  S('line',{x1:60,x2:990,y1:AY(lim.maxOracleAgeSec),y2:AY(lim.maxOracleAgeSec),stroke:HI,'stroke-dasharray':'7 5','stroke-width':2},c2);
  S('text',{x:66,y:AY(lim.maxOracleAgeSec)-6,'font-size':16,style:'fill:'+HI},c2,'limit '+lim.maxOracleAgeSec+' s');
  for(const v of [0,Math.round(am)])S('text',{x:54,y:AY(v)+5,'text-anchor':'end','font-size':16,class:'m'},c2,v);
  if(!frozen)S('text',{x:520,y:90,'text-anchor':'middle','font-size':17,class:'m'},c2,'this fault does not make the oracle old, so the age rule never fires');
  for(let k=0;k<=4;k++){const i=Math.round(x0+(x1-x0)*k/4);S('text',{x:X(i),y:166,'text-anchor':k===0?'start':k===4?'end':'middle','font-size':15,class:'m'},c2,sgt(PTS[i].t).slice(11,16)+' SGT')}
  /* readout */
  const r=$('#read');r.innerHTML='';const blind=none.rejected===0;
  r.className='box '+(blind&&!guards?'bad':W.rejected>0?'mint':'warn');
  H('div',{class:'lab'},r,LABEL[kind]+(guards?' with extra guards':' with the risk hook only'));
  const row=H('div',{class:'grid',style:'grid-template-columns:1fr 1fr 1fr;gap:.3rem .6rem;margin-top:.2rem'},r);
  const cell=(l,v,c)=>{const d=H('div',{},row);H('div',{class:'mut',style:'font-size:.85rem'},d,l);H('div',{class:'num '+(c||''),style:'font-size:1.5rem'},d,v)};
  cell('orders sent',W.orders);cell('accepted',W.accepted,W.accepted&&blind?'badc':'');cell('rejected',W.rejected,W.rejected?'mint':'');
  const rules=Object.entries(W.byRule).map(([k,v])=>k+' x'+v).join(', ');
  H('div',{class:'num',style:'font-size:.95rem;margin-top:.3rem'},r,rules?'Rejected by: '+rules:'Rejected by: nothing');
  H('div',{class:'num',style:'font-size:1.05rem;margin-top:.2rem'},r,'Loss with the hook: $'+f2(W.lossUsd,2)+'   with no hook at all: $'+f2(none.lossIfNoHookUsd,2));
  const msg={ 'stale-oracle':'Caught by oracle age, but only after '+lim.maxOracleAgeSec+' s: the first '+W.accepted+' orders got through. A tighter limit would catch it sooner.',
    'rpc-outage':'Caught by oracle age after '+lim.maxOracleAgeSec+' s. Until then the agent trades on prices it could no longer refresh.',
    'slippage-shock':'The hook checks the order price, not the fill, so it cannot see this. The circuit breaker stops the agent after '+FD.breakerMaxBreaches+' fills worse than '+FD.slippageBudgetBps+' bps.',
    'fee-change':'Fees are not in the hook\'s rules. The cost shows up only when you re-price your strategies (table below).',
    'duplicate-submission':'A hook with no memory accepts the same order twice. An idempotency key (same order, same 30 s slot) blocks the copy.'}[kind];
  H('div',{style:'font-size:1rem;margin-top:.3rem'},r,guards&&kind!=='stale-oracle'&&kind!=='rpc-outage'&&kind!=='fee-change'?'With the extra guard on: '+W.accepted+' accepted, '+W.rejected+' rejected. The hook alone: '+run(false).out.inWindow.accepted+' accepted.':msg);
  /* side */
  const sd=$('#side');sd.innerHTML='';
  if(kind==='slippage-shock'||kind==='fee-change'){
    const fee=kind==='fee-change'?+fe.value:FD.baseFeeBps,slip=kind==='slippage-shock'?+sl.value:FD.strategies.baseCosts.slippageBps;
    H('div',{class:'lab'},sd,'Build-night-1 strategies, re-priced: fee '+fee+' bps + slippage '+slip+' bps per leg');
    const tb=H('table',{class:'tbl'},sd),hd=H('tr',{},tb);['strategy','net now','net at shock','break-even'].forEach(t=>H('th',{},hd,t));
    FD.strategies.base.forEach(s=>{const be=FD.strategies.breakEvenCostBpsPerLeg.find(b=>b.id===s.id).bps,nw=CALC.repriceStrategy(s,fee,slip),tr=H('tr',{},tb);
      H('td',{},tr,s.name.replace(' (z-score)','').replace(' around Pyth','').slice(0,22));H('td',{class:'num'},tr,f2(s.pnlNetUsd,1));H('td',{class:'num '+(nw<s.pnlNetUsd-0.005?'badc':'')},tr,f2(nw,1));H('td',{class:'num'},tr,be===null?'no trades':f2(be,2)+' bps')});
    H('div',{class:'mut',style:'font-size:.85rem;margin-top:.4rem'},sd,'Break-even = the cost per leg at which gross P&L is used up. Simulated, on recorded data; not advice.');
  }else if(kind==='rpc-outage'){
    const c=CALC.retryCalls(p.durationTicks*5);
    H('div',{class:'lab'},sd,'While RPC says HTTP 429 for '+len.value+' min');
    H('div',{class:'num',style:'font-size:1.15rem'},sd,'retry every second: '+c.naive+' calls');

    H('div',{class:'mut',style:'font-size:.9rem;margin-top:.4rem'},sd,'The back-off is what src/rpc.ts does. It keeps you under the limit instead of making the outage worse. The age rule then protects the orders.');

  $('#chk').textContent=LV?'Live strip: a real Pyth read goes through the same checkOrder as the simulation. The fault chart is the recorded simulation.':(dflt?'At default settings this matches faults.json: '+(JSON.stringify(W)===JSON.stringify(guards?sc.withFix:sc.hookOnly)?'yes (every count and loss)':'NO'):'Recomputed in your browser with your settings; faults.json holds the defaults ('+sc.params.durationTicks/12+' min, '+FD.limits.maxOracleAgeSec+' s limit).');
}
[len,mv,sl,fe,ag].forEach(e=>e.addEventListener('input',render));
sourceLine($('#src'),{faults:FD},NP+' real SOL/USDC samples every 5 s. The paper agent and every fault are SIMULATED on top of them; not advice.',PTS[0].t,{sim:'No live service is touched.'});
/* live: a real Pyth read through the same hook */
let LS=null;
LIVE.start({el:$('#livebar'),enter:()=>{LV=true;live.show(true)},exit:()=>{LV=false;LS=null;live.show(false);render()},
  poll:async()=>{
    const r=await liveSnapshot(),el=$('#liveStrip');

    const d1=CALC.checkOrder(order,{oraclePrice:r.pyth,oracleAgeSec:r.ageSec+90},Object.assign({},FD.limits,{maxOracleAgeSec:+ag.value}));
    el.style.display='block';el.innerHTML='';const row=H('div',{class:'row',style:'gap:1.4rem;flex-wrap:wrap;align-items:baseline'},el);

    H('span',{class:'num'},row,'Pyth $'+f2(r.pyth,3)+', '+r.ageSec+' s old');
    H('span',{class:'num'},row,'order: buy '+order.sizeUsd+' USD at Orca $'+f2(order.price,2));

    H('span',{class:'num '+(d1.ok?'mint':'badc')},row,'if the oracle had stopped 90 s ago: '+(d1.ok?'ACCEPT':'REJECT ['+d1.rule+']'));
