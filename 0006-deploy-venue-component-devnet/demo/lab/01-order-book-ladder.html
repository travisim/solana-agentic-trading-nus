<script>const NS="http://www.w3.org/2000/svg";
const $=(s,r=document)=>r.querySelector(s);
function S(tag,attrs={},parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function H(tag,attrs={},parent,text){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const HASH=new URLSearchParams(location.hash.slice(1));
const hv=(k,d)=>HASH.has(k)?HASH.get(k):d;
const bps=(a,b)=>(a/b-1)*1e4;
const f2=(x,n=2)=>Number(x).toFixed(n);
function dateOf(sec){return new Date(sec*1000).toISOString().replace('T',' ').slice(0,16)+' UTC'}
const sgt=sec=>new Date((sec+8*3600)*1000).toISOString().replace('T',' ').slice(0,16)+' SGT';
/* footer caption: says whether the data is recorded/live/fixture, its capture date, and what the page shows.
   opts.sim = extra sentence flagging a simulated element. */
function sourceLine(el,data,what,ts,opts={}){
  const vals=Object.values(data);
  const fx=vals.some(d=>d&&d.fixture);
  const d0=vals.find(d=>d.capturedAt||d.generatedAt)||vals[0];
  const mode=d0.mode||'recorded';
  const iso=(d0.capturedAt||d0.generatedAt||'');
  const when=iso?sgt(Date.parse(iso)/1000):(ts?sgt(ts):'date unknown');
  el.innerHTML='';
  const a=H('span',{},el);
  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.append((mode==='live'?'Live data':'Recorded data (not live)')+', captured '+when+'. ');
  a.append(what+' Public mainnet reads, no keys.');
  if(opts.sim)H('span',{class:'fx'},a,' '+opts.sim);
  H('span',{style:'white-space:nowrap'},el,'Workshop 3');
}
function tlab(t,span){const s=new Date((t+28800)*1000).toISOString();return span<600?s.slice(11,19):s.slice(11,16)}

<script>/* Demo maths for Workshop 3. The SAME file is inlined into the demos and run by verify.mjs against ../code/out/*.json.
   Mirrors code/src/microstructure.ts, code/src/book.ts and code/src/analysis.ts. Levels are [price,size] pairs, best first. */
const CALC=(()=>{
  const BANDS=[25,50,100,200,500,1000];
  function topOfBook(bids,asks){
    const b=bids[0],a=asks[0],both=b&&a;
    const mid=both?(b[0]+a[0])/2:null,spread=both?a[0]-b[0]:null;
    return {bestBid:b?b[0]:null,bestAsk:a?a[0]:null,bidSize:b?b[1]:0,askSize:a?a[1]:0,mid,spread,spreadBps:spread!==null&&mid?spread/mid*1e4:null,crossed:both?b[0]>=a[0]:false};
  }
  function depthWithin(levels,side,ref,bps){
    const lim=ref*(bps/1e4);let s=0;
    for(const l of levels){if(side==='bid'?l[0]>=ref-lim:l[0]<=ref+lim)s+=l[1]}
    return s;
  }
  const imbalance=(b,a)=>b+a>0?(b-a)/(b+a):null;
  function microprice(t){if(t.bestBid===null||t.bestAsk===null||t.bidSize+t.askSize===0)return null;return (t.bestBid*t.askSize+t.bestAsk*t.bidSize)/(t.bidSize+t.askSize)}
  function ofiStep(p,c){
    if(p.bestBid===null||p.bestAsk===null||c.bestBid===null||c.bestAsk===null)return null;
    const bp=(c.bestBid>=p.bestBid?c.bidSize:0)-(c.bestBid<=p.bestBid?p.bidSize:0);
    const ap=(c.bestAsk<=p.bestAsk?c.askSize:0)-(c.bestAsk>=p.bestAsk?p.askSize:0);
    return bp-ap;
  }
  function walk(levels,qty,side){
    let left=qty,cost=0,used=0;
    for(const l of levels){if(left<=0)break;const take=Math.min(left,l[1]);cost+=take*l[0];left-=take;used++}
    const filled=qty-left,vwap=filled>0?cost/filled:null,best=levels[0]?levels[0][0]:null;
    const slip=vwap!==null&&best?(side==='buy'?vwap/best-1:1-vwap/best)*1e4:null;
    return {filled,cost,vwap,slippageBps:slip,levelsUsed:used,complete:left<=1e-12};
  }
  /* the numbers analysis.ts stores per snapshot (sizes 1, 10, 100) */
  function features(s,ref){
    const top=topOfBook(s.bids,s.asks),centre=top.mid!==null?top.mid:(ref!=null?ref:(top.bestBid!==null?top.bestBid:top.bestAsk));
    const depth=BANDS.map(bps=>({bps,bid:centre?depthWithin(s.bids,'bid',centre,bps):0,ask:centre?depthWithin(s.asks,'ask',centre,bps):0}));
    const d5=depth.find(d=>d.bps===500);
    return {top,microprice:microprice(top),depth,imbalance500:imbalance(d5.bid,d5.ask),midVsRefBps:top.mid&&ref?(top.mid/ref-1)*1e4:null};
  }
  /* ---- the mini_book program, in JavaScript: same 272-byte layout as program/src/lib.rs and code/src/book.ts ---- */
  const BOOK_LEN=272,SLOTS=16,HEADER=16,SLOT_LEN=16,BID=1,ASK=2;
  const ERRORS={1:'InvalidInstruction',2:'BadAccount',3:'NotInitialized',4:'InvalidSide',5:'ZeroPriceOrQty',6:'BookFull',7:'OrderNotFound',8:'AlreadyInitialized'};
  const dv=b=>new DataView(b.buffer,b.byteOffset,b.byteLength);
  const r32=(b,o)=>dv(b).getUint32(o,true),w32=(b,o,v)=>dv(b).setUint32(o,v>>>0,true);
  const pe=code=>Object.assign(new Error('custom program error '+code+' ('+(ERRORS[code]||'unknown')+')'),{code});
  const isInit=b=>b.length>=BOOK_LEN&&b[0]===0x4d&&b[1]===0x42&&b[2]===0x4b&&b[3]===0x31;
  function newBook(){const b=new Uint8Array(BOOK_LEN);b.set([0x4d,0x42,0x4b,0x31],0);w32(b,4,1);return b}
  function decodeBook(b){
    if(!isInit(b))throw new Error('not a mini_book account (magic MBK1 missing)');
    const orders=[];
    for(let i=0;i<SLOTS;i++){const o=HEADER+i*SLOT_LEN,s=b[o+4];if(s===BID||s===ASK)orders.push({id:r32(b,o),side:s===BID?'bid':'ask',price:r32(b,o+8),qty:r32(b,o+12)})}
    return {nextId:r32(b,4),fills:r32(b,8),lastFillPrice:r32(b,12),
      bids:orders.filter(x=>x.side==='bid').sort((a,c)=>c.price-a.price||a.id-c.id),
      asks:orders.filter(x=>x.side==='ask').sort((a,c)=>a.price-c.price||a.id-c.id)};
  }
  function place(b,side,price,qty){
    const w=b.slice(),logs=[];
    if(!isInit(w))throw pe(3);
    if(side!==BID&&side!==ASK)throw pe(4);
    if(!Number.isInteger(price)||!Number.isInteger(qty)||price<0||qty<=0||price>0xffffffff||qty>0xffffffff||(side===BID&&price===0))throw pe(5);
    const id=r32(w,4);w32(w,4,id+1);
    logs.push('ORDER id='+id+(side===BID?' BID':' ASK')+' px='+price+' qty='+qty);
    const opp=side===BID?ASK:BID;let left=qty;
    while(left>0){
      let best=-1;
      for(let i=0;i<SLOTS;i++){
        const o=HEADER+i*SLOT_LEN;if(w[o+4]!==opp)continue;
        const p=r32(w,o+8);if(side===BID?p>price:p<price)continue;
        if(best<0){best=i;continue}
        const bo=HEADER+best*SLOT_LEN,bp=r32(w,bo+8),better=side===BID?p<bp:p>bp;
        if(better||(p===bp&&r32(w,o)<r32(w,bo)))best=i;
      }
      if(best<0)break;
      const mo=HEADER+best*SLOT_LEN,mq=r32(w,mo+12),mp=r32(w,mo+8),mid=r32(w,mo),fill=Math.min(left,mq);
      logs.push('FILL taker='+id+' maker='+mid+' px='+mp+' qty='+fill);
      left-=fill;
      if(fill===mq)w.fill(0,mo,mo+SLOT_LEN);else w32(w,mo+12,mq-fill);
      w32(w,8,r32(w,8)+1);w32(w,12,mp);
    }
    if(left>0){
      let free=-1;for(let i=0;i<SLOTS;i++){if(w[HEADER+i*SLOT_LEN+4]===0){free=i;break}}
      if(free<0)throw pe(6);
      const o=HEADER+free*SLOT_LEN;w32(w,o,id);w[o+4]=side;w32(w,o+8,price);w32(w,o+12,left);logs.push('REST id='+id+' qty='+left);
    }
    b.set(w);return {id,logs};
  }
  function cancel(b,id){
    if(!isInit(b))throw pe(3);
    for(let i=0;i<SLOTS;i++){const o=HEADER+i*SLOT_LEN;if(b[o+4]!==0&&r32(b,o)===id){b.fill(0,o,o+SLOT_LEN);return ['CANCEL id='+id]}}
    throw pe(7);
  }
  /* run one recorded step: returns {logs,error} and mutates b (a failed step leaves b unchanged) */
  function step(b,st){
    try{
      if(st.kind==='init')return {logs:[],error:null};
      if(st.kind==='place')return {logs:place(b,st.order.side==='bid'?BID:ASK,st.order.price,st.order.qty).logs,error:null};
      return {logs:cancel(b,Number(/order (\d+)/.exec(st.label)[1])),error:null};
    }catch(e){return {logs:[],error:e.code||-1}}
  }
  /* ---- trade flow ---- */
  function tickRule(prices){const out=[];let last=0;for(let i=0;i<prices.length;i++){if(i>0){if(prices[i]>prices[i-1])last=1;else if(prices[i]<prices[i-1])last=-1}out.push(last)}return out}
  function tickAccuracy(swaps){ /* swaps: [{price,side}] */
    const sg=tickRule(swaps.map(s=>s.price));let agree=0,total=0;
    swaps.forEach((s,i)=>{if(!s.side||sg[i]===0)return;total++;if((s.side==='buy'?1:-1)===sg[i])agree++});
    return {agree,total,share:total?agree/total:0};
  }
  function windows(swaps,windowSec){ /* swaps: [{t,price,usdc,side}] oldest first */
    const t0=swaps[0].t,m=new Map();
    for(const s of swaps){const k=Math.floor((s.t-t0)/windowSec);if(!m.has(k))m.set(k,[]);m.get(k).push(s)}
    return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([k,ss])=>{
      let buy=0,sell=0;for(const s of ss){if(s.side==='buy')buy+=s.usdc;else sell+=s.usdc}
      return {tStart:t0+k*windowSec,trades:ss.length,buyUsd:buy,sellUsd:sell,imbalance:buy+sell>0?(buy-sell)/(buy+sell):null,open:ss[0].price,close:ss[ss.length-1].price,retBps:(ss[ss.length-1].price/ss[0].price-1)*1e4};
    });
  }
  function rollSpread(prices){
    const d=[];for(let i=1;i<prices.length;i++)d.push(prices[i]-prices[i-1]);
    if(d.length<3)return null;
    const a=d.slice(1),b=d.slice(0,-1),ma=a.reduce((s,x)=>s+x,0)/a.length,mb=b.reduce((s,x)=>s+x,0)/b.length;
    let cov=0;for(let i=0;i<a.length;i++)cov+=(a[i]-ma)*(b[i]-mb);cov/=a.length;
    return cov<0?2*Math.sqrt(-cov):null;
  }
  const centreOf=(top,ref)=>top.mid!==null?top.mid:(ref!=null?ref:(top.bestBid!==null?top.bestBid:top.bestAsk));
  return {centreOf,BANDS,topOfBook,depthWithin,imbalance,microprice,ofiStep,walk,features,BOOK_LEN,BID,ASK,ERRORS,newBook,decodeBook,place,cancel,step,isInit,tickRule,tickAccuracy,windows,rollSpread};
})();
if(typeof module!=='undefined')module.exports=CALC;
</script>
<script>/* Live mode: read-only public Solana data, straight from the browser. No keys, no wallets, no writes.
   Browser-safe RPC: solana-rpc.publicnode.com (api.mainnet.solana.com returns 403 for browser Origins). */
const LIVE=(()=>{
  const DEVNET=(typeof HASH!=='undefined'&&HASH.get('devrpc'))||'https://api.devnet.solana.com';
  const RPC=(typeof HASH!=='undefined'&&HASH.get('rpc'))||'https://solana-rpc.publicnode.com';
  const POOL='Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE',SOL_MINT='So11111111111111111111111111111111111111112',USDC_MINT='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
  const PYTH_ACCOUNT='7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE',PYTH_OWNER='rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ',PYTH_DISC='22f123639d7ef4cd';
  const A58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n>0n){s=A58[Number(n%58n)]+s;n/=58n}for(const x of b){if(x===0)s='1'+s;else break}return s}
  function fromB64(s){const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  const hex=(u,a,b)=>Array.from(u.slice(a,b),x=>x.toString(16).padStart(2,'0')).join('');
  let id=1;
  async function rpc(method,params,url){
    const r=await fetch(url||RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error){const e=new Error(j.error.message||'rpc error');e.rate=/429|rate|too many/i.test(JSON.stringify(j.error));throw e}
    return j.result;
  }
  async function account(addr,url,commitment){
    const r=await rpc('getAccountInfo',[addr,{encoding:'base64',commitment:commitment||'confirmed'}],url);
    if(!r||!r.value)throw new Error('account not found');
    return {slot:r.context.slot,owner:r.value.owner,lamports:r.value.lamports,bytes:fromB64(r.value.data[0])};
  }
  /* Pyth SOL/USD PriceUpdateV2 account: price i64@73, conf i64@81, expo i32@89, publish time i64@93, posted slot u64@125 */
  async function fetchPythPrice(){
    const a=await account(PYTH_ACCOUNT);
    if(a.owner!==PYTH_OWNER)throw new Error('unexpected Pyth owner');
    const u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    if(u.length<133||hex(u,0,8)!==PYTH_DISC)throw new Error('not a Pyth price account');
    const expo=v.getInt32(89,true);
    return {price:Number(v.getBigInt64(73,true))*10**expo,publishTime:Number(v.getBigInt64(93,true)),postedSlot:Number(v.getBigUint64(125,true)),currentSlot:a.slot};
  }
  /* Orca whirlpool: sqrtPrice u128@65 (Q64.64); price = (sqrt/2^64)^2 * 10^(9-6) */
  async function fetchOrcaPrice(){

  kv(g,'Bid depth, '+bps+' bps',fmt(bd,bd<10?3:1)+' '+baseName(m));
  kv(g,'Ask depth, '+bps+' bps',fmt(ad,ad<10?3:1)+' '+baseName(m));
  kv(g,'Imbalance',imb===null?'—':(imb>=0?'+':'')+fmt(imb,2),imb===null?'':imb>0?'mint':'lavc');
  kv(g,'Orders (bids/asks)',(s.orders?s.orders.bids+' / '+s.orders.asks:'—'));
  const ref=s.refPrice;
  const k2=$('#kv2');k2.innerHTML='';k2.className='box mint';H('div',{class:'lab'},k2,'Market order of '+fmt(q,q<1?2:q<10?1:0)+' '+baseName(m)+' (walks the book)');
  const g2=H('div',{class:'kv',style:'margin-top:.3rem'},k2);
  const wb=CALC.walk(asks,q,'buy'),ws=CALC.walk(bids,q,'sell');
  kv(g2,'Buy: average price',wb.vwap===null?'no asks':px(wb.vwap,m));
  kv(g2,'Buy: worse than best ask',wb.slippageBps===null?'—':fmt(wb.slippageBps,1)+' bps','warnc');
  kv(g2,'Sell: average price',ws.vwap===null?'no bids':px(ws.vwap,m));
  kv(g2,'Sell: worse than best bid',ws.slippageBps===null?'—':fmt(ws.slippageBps,1)+' bps','warnc');
  kv(g2,'Filled (buy / sell)',(wb.complete?'all':fmt(wb.filled,2))+' / '+(ws.complete?'all':fmt(ws.filled,2)));
  if(ref){kv(g2,'Orca SOL/USDC price',fmt(ref,3));kv(g2,'Buy average vs Orca',wb.vwap?fmt((wb.vwap/ref-1)*1e4,0)+' bps':'—','badc')}
  else kv(g2,'Reference price','only for SOL/USDC');
}
function footer(){
  if(LV){sourceLine($('#src'),{ladder:{mode:'live',capturedAt:new Date().toISOString()}},'Live reads of the Phoenix market account from your browser; levels, spread and depth are computed here with the same functions as the recorded data.',0)}
  else sourceLine($('#src'),{ladder:LAD},(MK[mi].snapshots.length)+' snapshots of '+MK[mi].name+' ('+MK[mi].cluster+'), one every '+LAD.intervalSec+' s; ladder drawn from the account the Phoenix program owns.',0);
}
pos.addEventListener('input',()=>{pos.dataset.hold='1';render()});band.addEventListener('input',render);qty.addEventListener('input',render);
function useRecorded(){LV=false;setPos();tabs();footer();render()}
function useLive(){LV=true;LSNAP=MK.map(()=>[]);LREF=null;tabs();setPos();footer();render()}
LIVE.start({el:$('#livebar'),intervalMs:10000,enter:()=>{useLive();$('#kv1').textContent='Waiting for the first live read...'},exit:useRecorded,
  poll:async()=>{
    const m=MK[mi];const sn=await LIVE.fetchPhoenix({address:m.address,cluster:m.cluster},100);
    if(m.name==='SOL/USDC'){try{LREF=(await LIVE.fetchOrcaPrice()).price}catch(e){/* keep the last value */}}
    sn.refPrice=m.name==='SOL/USDC'?LREF:null;
    const arr=LSNAP[mi];arr.push({slot:sn.slot,t:sn.t,refPrice:sn.refPrice,bids:sn.bids,asks:sn.asks,orders:sn.orders});if(arr.length>120)arr.shift();
    pos.max=arr.length-1;if(!pos.dataset.hold)pos.value=pos.max;footer();render();return {slot:sn.slot,note:m.name}}});
setPos();tabs();footer();render();
</script></body></html>
