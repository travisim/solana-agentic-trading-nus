<div class="page">

<script>const NS="http://www.w3.org/2000/svg";
const $=(s,r=document)=>r.querySelector(s);
function S(tag,attrs={},parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function H(tag,attrs={},parent,text){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const HASH=new URLSearchParams(location.hash.slice(1));
const hv=(k,d)=>HASH.has(k)?HASH.get(k):d;
const bps=(a,b)=>(a/b-1)*1e4;
const f2=(x,n=2)=>Number(x).toFixed(n);
function dateOf(sec){return new Date(sec*1000).toISOString().replace('T',' ').slice(0,16)+' UTC'}
const sgt=sec=>new Date((sec+8*3600)*1000).toISOString().replace('T',' ').slice(0,16)+' SGT';
/* footer caption: says whether the data is recorded/live/fixture, its capture date, and what the page shows.
   opts.sim = extra sentence flagging a simulated element. */
function sourceLine(el,data,what,ts,opts={}){
  const vals=Object.values(data);
  const fx=vals.some(d=>d&&d.fixture);
  const d0=vals.find(d=>d.capturedAt||d.generatedAt)||vals[0];
  const mode=d0.mode||'recorded';
  const iso=(d0.capturedAt||d0.generatedAt||'');
  const when=iso?sgt(Date.parse(iso)/1000):(ts?sgt(ts):'date unknown');
  el.innerHTML='';
  const a=H('span',{},el);
  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.append((mode==='live'?'Live data':'Recorded data (not live)')+', captured '+when+'. ');
  a.append(what+' Public mainnet reads, no keys.');
  if(opts.sim)H('span',{class:'fx'},a,' '+opts.sim);
  H('span',{style:'white-space:nowrap'},el,'Workshop 2');
}
function tlab(t,span){const s=new Date((t+28800)*1000).toISOString();return span<600?s.slice(11,19):s.slice(11,16)}

<script>/* The demos' maths. This is the same logic as demo-repo/code/src (labels.ts, agent.ts, explain.ts, overlap.ts, meta.ts), written in plain JavaScript.
   The demos inline this file and verify.mjs runs it in Node against ../code/out/*.json, so the page and the code agree. */
const CALC=(()=>{
  const r=(x,d)=>Math.round(x*10**d)/10**d;
  const sign=x=>x>0?1:x<0?-1:0;
  /* volatility: exponentially weighted std of one-step returns, in bps. vol[0] = null */
  function ewmVol(prices,span){
    const a=2/(span+1);let v=null;
    return prices.map((p,i)=>{if(i===0)return null;const x=(p/prices[i-1]-1)*1e4;v=v===null?x*x:(1-a)*v+a*x*x;return Math.sqrt(v)});
  }
  const width=(vol,P)=>Math.max(P.minWidthBps,P.mult*vol*Math.sqrt(P.horizon));
  /* label one decision. partial=true (live): a barrier already touched counts even if the horizon is not over; otherwise unresolved -> null */
  function labelAt(prices,vol,i,P,partial){
    const v=vol[i];if(v===null||v===undefined)return null;
    const last=i+P.horizon,N=prices.length;
    if(last>N-1&&!partial)return null;
    const price=prices[i],w=width(v,P),up=price*(1+w/1e4),dn=price*(1-w/1e4);
    let exitI=Math.min(last,N-1),touch=last<=N-1?'time':'pending';
    for(let k=i+1;k<=Math.min(last,N-1);k++){const x=prices[k];if(x>=up){exitI=k;touch='up';break}if(x<=dn){exitI=k;touch='down';break}}
    if(touch==='pending')return {i,price,volBps:v,widthBps:w,up,dn,exitI,touch,label:null,retBps:(prices[exitI]/price-1)*1e4,fixed:null};
    return {i,price,volBps:v,widthBps:w,up,dn,exitI,touch,label:touch==='up'?1:touch==='down'?-1:0,retBps:(prices[exitI]/price-1)*1e4,
      fixed:last<=N-1?sign(prices[last]/price-1):null};
  }
  function tripleBarrier(prices,P,partial){
    const vol=ewmVol(prices,P.volSpan),labels=[],pending=[];let dropped=0;
    for(let i=P.volSpan;i<prices.length-1;i+=P.every){const l=labelAt(prices,vol,i,P,partial);if(l&&l.touch!=='pending')labels.push(l);else if(l)pending.push(l);else dropped++}
    return {vol,labels,pending,dropped};
  }
  function labelStats(labels){
    const n=labels.length,c=t=>labels.filter(l=>l.touch===t).length,fd=labels.filter(l=>l.fixed!==l.label).length;
    return {decisions:n,up:c('up'),down:c('down'),time:c('time'),meanHoldSteps:n?r(labels.reduce((a,l)=>a+(l.exitI-l.i),0)/n,2):0,meanWidthBps:n?r(labels.reduce((a,l)=>a+l.widthBps,0)/n,2):0,fixedDisagree:fd,fixedDisagreePct:n?r(100*fd/n,1):0};
  }
  /* ---- agent ---- */
  function roll(i,seed){let x=Math.imul(i+1,0x9e3779b1)^Math.imul(seed+7,0x85ebca6b);x^=x>>>15;x=Math.imul(x,0x2c1b3c6d);x^=x>>>12;return x>>>0}
  function truthAt(prices,others,vol,i,L){
    const v=vol[i];if(v===null||v===undefined||i<L)return null;
    const mom=(prices[i]/prices[i-L]-1)*1e4,noise=v*Math.sqrt(L),o=others[i];
    return {momBps:mom,ratio:noise>0?Math.abs(mom)/noise:0,gapBps:(o===null||o===undefined)?null:Math.abs(o-prices[i])/prices[i]*1e4};
  }
  const spanText=(L,stepSec)=>stepSec===null?L+' bars':(L*stepSec)+' s';
  function decide(prices,others,vol,l,A,stepSec){
    const tr=truthAt(prices,others,vol,l.i,A.lookback);if(!tr)return null;
    const z=tr.momBps/Math.max(1e-9,vol[l.i]*Math.sqrt(A.lookback));
    const side=tr.ratio>=A.zMin?(tr.momBps>0?1:-1):0;
    let word=tr.momBps>=0?'rose':'fell',mom=Math.abs(tr.momBps),ratio=tr.ratio,gapClaim=tr.gapBps===null?null:Math.ceil(tr.gapBps*10)/10,injected='none';
    const rr=roll(l.i,A.seed);
    if(rr%100<A.errorRatePct&&mom>=0.5){
      const kinds=['direction','size'];if(tr.gapBps!==null&&tr.gapBps>=0.4)kinds.push('gap');
      injected=kinds[Math.floor(rr/100)%kinds.length];
      if(injected==='direction')word=word==='rose'?'fell':'rose';
      if(injected==='size'){mom*=2.5;ratio*=2.5}
      if(injected==='gap')gapClaim=Math.max(0.1,Math.floor(tr.gapBps/4*10)/10);
    }
    const span=spanText(A.lookback,stepSec),gapPart=gapClaim===null?'':' The two venues agree within '+gapClaim.toFixed(1)+' bps.';
    const reason=side===0?`Hold: SOL ${word} ${mom.toFixed(1)} bps in the last ${span}, only ${ratio.toFixed(1)}x the recent noise, too small to act on.${gapPart}`
      :`${side===1?'Buy':'Sell'}: SOL ${word} ${mom.toFixed(1)} bps in the last ${span}, ${ratio.toFixed(1)}x the recent noise, so follow the move.${gapPart}`;
    const trade=side!==0,pend=l.label===null||l.label===undefined;
    return {i:l.i,side,momBps:r(tr.momBps,3),z:r(z,3),gapBps:tr.gapBps===null?null:r(tr.gapBps,3),reason,injected,
      outcome:!trade?'none':pend?'pending':l.label===0?'timeout':l.label===side?'win':'loss',label:pend?null:l.label,sideRetBps:trade&&!pend?r(side*l.retBps,3):null,truth:tr};
  }
  /* ---- explanation checker ---- */
  function parseReason(t){
    const m=re=>{const x=re.exec(t);return x?Number(x[1]):null};
    const w=/\b(rose|fell)\b/i.exec(t);
    return {word:w?w[1].toLowerCase():null,momBps:m(/(\d+(?:\.\d+)?)\s*bps in the last/i),ratio:m(/(\d+(?:\.\d+)?)x the recent noise/i),gapWithinBps:m(/within\s+(\d+(?:\.\d+)?)\s*bps/i)};
  }
  const close=(c,t)=>Math.abs(c-t)<=Math.max(0.1,0.05*Math.abs(t));
  function checkReason(text,t){
    const c=parseReason(text),pr=[],tw=t.momBps>=0?'rose':'fell';
    if(c.word===null)pr.push('no direction stated');else if(c.word!==tw)pr.push(`says it ${c.word}, the data says it ${tw}`);
    if(c.momBps===null)pr.push('no size in bps stated');else if(!close(c.momBps,Math.abs(t.momBps)))pr.push(`says ${c.momBps} bps, the data says ${Math.abs(t.momBps).toFixed(1)} bps`);
    if(c.ratio===null)pr.push('no noise ratio stated');else if(!close(c.ratio,t.ratio))pr.push(`says ${c.ratio}x the noise, the data says ${t.ratio.toFixed(1)}x`);
    if(c.gapWithinBps!==null&&t.gapBps!==null&&t.gapBps>c.gapWithinBps+0.05)pr.push(`says venues agree within ${c.gapWithinBps} bps, the gap is ${t.gapBps.toFixed(1)} bps`);
    return {ok:pr.length===0,problems:pr,claims:c};
  }
  /* ---- overlap and leakage ---- */
  function concurrency(spans,steps){const c=new Array(steps).fill(0);for(const s of spans)for(let t=s.i;t<=s.exitI&&t<steps;t++)c[t]++;return c}
  function uniqueness(spans,conc){return spans.map(s=>{let sum=0,n=0;for(let t=s.i;t<=s.exitI&&t<conc.length;t++){sum+=1/conc[t];n++}return n?sum/n:1})}
  const leaking=(spans,cut)=>spans.filter(s=>s.i<cut&&s.exitI>=cut).length;
  function overlap(labels,steps){
    const conc=concurrency(labels,steps),uniq=uniqueness(labels,conc),cov=conc.filter(c=>c>0),sum=uniq.reduce((a,b)=>a+b,0);
    return {conc,uniq,stats:{labels:labels.length,meanConcurrency:r(cov.reduce((a,b)=>a+b,0)/Math.max(1,cov.length),3),maxConcurrency:Math.max(0,...conc),meanUniqueness:r(sum/Math.max(1,labels.length),4),effectiveN:r(sum,3)}};
  }
  /* ---- gate ---- */
  const sigmoid=z=>1/(1+Math.exp(-z));
  function predict(m,x){let z=m.b;for(let k=0;k<x.length;k++)z+=m.w[k]*((x[k]-m.mean[k])/m.std[k]);return sigmoid(z)}
  function tally(rows){const n=rows.length,w=rows.reduce((a,x)=>a+x.win,0),p=n?w/n:0;return {trades:n,wins:w,hitRatePct:n?r(100*p,1):null,ci95Pct:n?r(100*1.96*Math.sqrt(p*(1-p)/n),1):null}}
  function gate(testRows,thr){
    const acted=testRows.filter(x=>x.p>=thr),blocked=testRows.filter(x=>x.p<thr);
    return {noGate:tally(testRows),withGate:tally(acted),blocked:{trades:blocked.length,wouldHaveWon:blocked.reduce((a,x)=>a+x.win,0)}};
  }
  return {r,sign,ewmVol,width,labelAt,tripleBarrier,labelStats,roll,truthAt,decide,parseReason,checkReason,concurrency,uniqueness,leaking,overlap,predict,tally,gate};
})();
if(typeof module!=='undefined')module.exports=CALC;
</script>
<script>/* Live mode: read-only public Solana data, straight from the browser. No keys, no wallets, no writes.
   Browser-safe RPC: solana-rpc.publicnode.com (api.mainnet.solana.com returns 403 for browser Origins). */
const LIVE=(()=>{
  const RPC=(typeof HASH!=='undefined'&&HASH.get('rpc'))||'https://solana-rpc.publicnode.com';
  const POOL='Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE',SOL_MINT='So11111111111111111111111111111111111111112',USDC_MINT='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
  const PYTH_ACCOUNT='7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE',PYTH_OWNER='rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ',PYTH_DISC='22f123639d7ef4cd';
  const A58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n>0n){s=A58[Number(n%58n)]+s;n/=58n}for(const x of b){if(x===0)s='1'+s;else break}return s}
  function fromB64(s){const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  const hex=(u,a,b)=>Array.from(u.slice(a,b),x=>x.toString(16).padStart(2,'0')).join('');
  let id=1;
  async function rpc(method,params){
    const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error){const e=new Error(j.error.message||'rpc error');e.rate=/429|rate|too many/i.test(JSON.stringify(j.error));throw e}
    return j.result;
  }
  async function account(addr){
    const r=await rpc('getAccountInfo',[addr,{encoding:'base64',commitment:'confirmed'}]);
    if(!r||!r.value)throw new Error('account not found');
    return {slot:r.context.slot,owner:r.value.owner,bytes:fromB64(r.value.data[0])};
  }
  /* Pyth SOL/USD PriceUpdateV2 account: price i64@73, conf i64@81, expo i32@89, publish time i64@93, posted slot u64@125 */
  async function fetchPythPrice(){
    const a=await account(PYTH_ACCOUNT);
    if(a.owner!==PYTH_OWNER)throw new Error('unexpected Pyth owner');
    const u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    if(u.length<133||hex(u,0,8)!==PYTH_DISC)throw new Error('not a Pyth price account');
    const expo=v.getInt32(89,true);
    return {price:Number(v.getBigInt64(73,true))*10**expo,publishTime:Number(v.getBigInt64(93,true)),postedSlot:Number(v.getBigUint64(125,true)),currentSlot:a.slot};
  }
  /* Orca whirlpool: sqrtPrice u128@65 (Q64.64); price = (sqrt/2^64)^2 * 10^(9-6) */
  async function fetchOrcaPrice(){
    const a=await account(POOL),u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    const sq=(v.getBigUint64(73,true)<<64n)|v.getBigUint64(65,true);
    const r=Number(sq)/2**64;return {price:r*r*1000,slot:a.slot};
  }
  async function fetchJupiterQuote(){
    const r=await fetch('https://lite-api.jup.ag/swap/v1/quote?inputMint='+SOL_MINT+'&outputMint='+USDC_MINT+'&amount=1000000000&slippageBps=50');
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();return {price:Number(j.outAmount)/1e6};
  }
  /* swaps: same rule as code/src/swaps.ts. A swap moves the two pool vaults in opposite directions. */
  let vaults=null;
  async function loadVaults(){
    if(vaults)return vaults;const a=await account(POOL),u=a.bytes;
    if(u.length<245||b58(u.slice(101,133))!==SOL_MINT||b58(u.slice(181,213))!==USDC_MINT)throw new Error('pool is not SOL/USDC');
    return vaults={sol:b58(u.slice(133,165)),usdc:b58(u.slice(213,245))};
  }
  function swapFromTx(sig,tx,vt){
    if(!tx||!tx.meta||tx.meta.err||tx.blockTime==null)return null;
    const keys=tx.transaction.message.accountKeys.map(k=>typeof k==='string'?k:k.pubkey);
    const d=(vault,mint)=>{const i=keys.indexOf(vault);if(i<0)return null;
      const f=l=>(l||[]).find(b=>b.accountIndex===i&&b.mint===mint),pre=f(tx.meta.preTokenBalances),post=f(tx.meta.postTokenBalances);
      return pre&&post?(Number(post.uiTokenAmount.amount)-Number(pre.uiTokenAmount.amount))/10**pre.uiTokenAmount.decimals:null};
    const ds=d(vt.sol,SOL_MINT),du=d(vt.usdc,USDC_MINT);
    if(ds===null||du===null||ds===0||du===0||Math.sign(ds)===Math.sign(du))return null;
    return {t:tx.blockTime,slot:tx.slot,side:ds>0?'sell':'buy',solAmount:Math.abs(ds),usdcAmount:Math.abs(du),price:Math.abs(du)/Math.abs(ds),sig};
  }
  /* state={lastSig:null}; returns new swaps oldest first (at most `max`), and the current slot */
  async function fetchNewSwaps(state,max=10){
    const vt=await loadVaults();

<script>/* Live price path for the demos: one Orca pool price and one Pyth oracle price per step (two RPC account reads through publicnode),
   plus a Jupiter quote at most every 20 s (it is shown, never required; a 429 only changes a note). Reads only, no keys, no wallets. */
const LP=(()=>{
  let pts=[],jup=null,lastJup=0,jupNote='';
  async function tick(){
    const [o,p]=await Promise.all([LIVE.fetchOrcaPrice(),LIVE.fetchPythPrice()]);
    const t=Math.floor(Date.now()/1000);
    pts.push({t,orca:o.price,pyth:p.price,slot:p.currentSlot||o.slot,publishTime:p.publishTime});
    if(pts.length>120)pts.shift();
    if(Date.now()-lastJup>20000){lastJup=Date.now();LIVE.fetchJupiterQuote().then(j=>{jup=j.price;jupNote=''}).catch(e=>{jupNote=e&&e.rate?'Jupiter throttled':'Jupiter unavailable'})}
    return {slot:p.currentSlot||o.slot,note:jupNote||(jup?'Jupiter '+jup.toFixed(2):'')};
  }
  return {pts:()=>pts,tick,reset(){pts=[];jup=null;lastJup=0;jupNote=''},jup:()=>jup};
})();
</script>

    const t=H('div',{style:'height:.5rem;border:1.5px solid #4a4670;border-radius:9px;position:relative;overflow:hidden'},d);H('div',{style:`position:absolute;top:0;height:100%;background:${w>=0?UP:DN};left:${w>=0?50:50-50*Math.abs(w)/mx}%;width:${50*Math.abs(w)/mx}%`},t)});
  const nv=MT.stats.testWithGateNaiveSplit;
  H('div',{class:'mut',style:'margin-top:.5rem;font-size:.92rem'},s3,'Same gate fitted WITHOUT purging the '+MT.split.purgedTrades+' leaking training trades: '+nv.trades+' trades, hit rate '+(nv.trades?nv.hitRatePct+'% (+/- '+nv.ci95Pct+')':'n/a')+' at the default line.');
  const c=el('chk');
  if(LV)c.textContent='Live: each new decision from the pretend agent on real Orca and Pyth reads is scored by the same gate weights. Volatility uses a shorter window live, so the estimates are indicative.';
  else{let md=0;test.forEach(r=>{const p=CALC.predict(MT.model,r.x);md=Math.max(md,Math.abs(p-r.p))});
    c.textContent='Probabilities come from code/out/meta.json (trained in TypeScript); the page recomputes them from the weights, largest difference '+md.toExponential(1)+'. Test trades with the gate at this line: '+G.withGate.trades+' (the file, at its default line: '+MT.stats.testWithGate.trades+').'}
}
thr.addEventListener('input',render);
/* live: a stream of new decisions scored by the gate */
function liveRender(){
  const pts=LP.pts();if(pts.length<30){el('s3').textContent='Waiting for live prices ('+pts.length+' so far, need 30)...';return}
  const prices=pts.map(x=>x.orca),others=pts.map(x=>x.pyth),lab={mult:D.mult,horizon:12,every:2,minWidthBps:D.minWidthBps,volSpan:8};
  const res=CALC.tripleBarrier(prices,lab,true),all=res.labels.concat(res.pending).sort((a,b)=>a.i-b.i),T=+thr.value,out=[];
  for(const l of all){const d=CALC.decide(prices,others,res.vol,l,{lookback:6,zMin:A0.zMin,errorRatePct:0,seed:A0.seed},5);if(!d||d.side===0)continue;
    const x=[Math.abs(d.z),d.gapBps===null?0:d.gapBps,l.volBps];out.push({t:pts[l.i].t,side:d.side,p:CALC.predict(MT.model,x),outcome:d.outcome})}
  const s3=el('s3');s3.innerHTML='';H('div',{class:'lab'},s3,'Live decisions and the gate ('+out.length+')');
  out.slice(-9).reverse().forEach(o=>{const d=H('div',{class:'row num',style:'justify-content:space-between;font-size:.98rem;margin-top:.2rem'},s3);H('span',{},d,tlab(o.t,86400)+' '+(o.side>0?'BUY':'SELL')+' p '+o.p.toFixed(2));
    H('span',{style:'color:'+(o.p>=T?UP:HI)},d,(o.p>=T?'ACT':'BLOCKED')+' · '+(o.outcome==='win'?'won':o.outcome==='loss'?'lost':o.outcome==='timeout'?'timed out':'open'))});
  if(!out.length)H('div',{class:'mut'},s3,'No decision has cleared the agent\'s rule yet.');
}
function footer(){
  if(LV)sourceLine(el('src'),{x:{mode:'live',capturedAt:new Date().toISOString()}},'live Orca pool and Pyth reads from your browser; the gate weights come from recorded data. Not advice.',0);
  else sourceLine(el('src'),{x:MT},MT.split.trainTrades+' training and '+MT.split.testTrades+' test trades on '+N+' samples ('+sgt(LB.points[0].t)+' to '+sgt(LB.points[N-1].t)+'). Simulated, on recorded data; not advice.',LB.points[0].t);
}
LIVE.start({el:el('livebar'),
  enter:()=>{LV=true;LP.reset();footer();el('s3').textContent='Waiting for live prices...'},
  exit:()=>{LV=false;footer();render()},
  poll:async()=>{const r=await LP.tick();footer();liveRender();return {slot:r.slot,note:r.note}}});
render();footer();
</script></body></html>
