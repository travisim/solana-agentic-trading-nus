<div class="page" style="gap:.45rem">

<script>const NS="http://www.w3.org/2000/svg";
const $=(s,r=document)=>r.querySelector(s);
function S(tag,attrs={},parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function H(tag,attrs={},parent,text){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const HASH=new URLSearchParams(location.hash.slice(1));
const hv=(k,d)=>HASH.has(k)?HASH.get(k):d;
const bps=(a,b)=>(a/b-1)*1e4;
const f2=(x,n=2)=>Number(x).toFixed(n);
function dateOf(sec){return new Date(sec*1000).toISOString().replace('T',' ').slice(0,16)+' UTC'}
const sgt=sec=>new Date((sec+8*3600)*1000).toISOString().replace('T',' ').slice(0,16)+' SGT';
/* footer caption: says whether the data is recorded/live/fixture, its capture date, and what the page shows.
   opts.sim = extra sentence flagging a simulated element. */
function sourceLine(el,data,what,ts,opts={}){
  const vals=Object.values(data);
  const fx=vals.some(d=>d&&d.fixture);
  const d0=vals.find(d=>d.capturedAt||d.generatedAt)||vals[0];
  const mode=d0.mode||'recorded';
  const iso=(d0.capturedAt||d0.generatedAt||'');
  const when=iso?sgt(Date.parse(iso)/1000):(ts?sgt(ts):'date unknown');
  el.innerHTML='';
  const a=H('span',{},el);
  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.append((mode==='live'?'Live data':'Recorded data (not live)')+', captured '+when+'. ');
  a.append(what+' Public mainnet reads, no keys.');
  if(opts.sim)H('span',{class:'fx'},a,' '+opts.sim);
  H('span',{style:'white-space:nowrap'},el,'Build night 5');
}
function tlab(t,span){const s=new Date((t+28800)*1000).toISOString();return span<600?s.slice(11,19):s.slice(11,16)}
</script>
<script>/* Pure calculation functions used by the demos (in the browser) and by verify.mjs (in Node). No dependencies.
   Mirrors code/src: bars.ts + cusum.ts (build night 2), risk.ts (build night 1), agent.ts, timer.ts, drill.ts, rubric.ts. */
const CALC=(()=>{
  const r2=x=>Math.round(x*100)/100, r3=x=>Math.round(x*1000)/1000, r6=x=>Math.round(x*1e6)/1e6;
  /* Dollar bars: a bar closes on the swap that takes its dollars to the threshold or beyond (that swap stays in the bar). */
  function dollarBars(swaps,thr){
    const bars=[];let cur=null;
    for(const s of swaps){
      if(!cur){cur={tStart:s.t,tEnd:s.t,open:s.price,high:s.price,low:s.price,close:s.price,volumeUsd:0,count:0};bars.push(cur)}
      cur.high=Math.max(cur.high,s.price);cur.low=Math.min(cur.low,s.price);cur.close=s.price;cur.volumeUsd+=s.usdcAmount;cur.count++;cur.tEnd=s.t;
      if(cur.volumeUsd>=thr)cur=null;
    }
    return bars;
  }
  /* CUSUM: sPos collects up moves, sNeg down moves (bps); past the threshold an event fires and both empty.
     Rows record the buckets at the moment of the check, rounded to 3 decimals like the code's series. */
  function cusum(series,thr){
    let sPos=0,sNeg=0;const rows=[],events=[];
    for(let i=0;i<series.length;i++){
      if(i>0){const dp=(series[i].price/series[i-1].price-1)*1e4;sPos=Math.max(0,sPos+dp);sNeg=Math.min(0,sNeg+dp)}
      let fired=null;
      if(sPos>thr)fired='up';else if(sNeg<-thr)fired='down';
      rows.push({t:series[i].t,price:series[i].price,sPos:r3(sPos),sNeg:r3(sNeg),fired});
      if(fired){events.push({t:series[i].t,direction:fired,price:series[i].price,i});sPos=0;sNeg=0}
    }
    return {rows,events};
  }
  const LIMITS={maxNotionalUsd:1000,maxOracleGapBps:50,maxOracleAgeSec:60};
  /* The risk hook: same four rules, same order, same wording as code/src/risk.ts */
  function checkOrder(o,ctx,L=LIMITS){
    const no=(rule,reason)=>({ok:false,rule,reason}),{sizeUsd,price}=o;
    if(o.side!=='buy'&&o.side!=='sell')return no('unit-sanity',`side "${o.side}" is not buy or sell`);
    if(!Number.isFinite(sizeUsd)||sizeUsd<=0)return no('unit-sanity',`size ${sizeUsd} USD is not a positive number`);
    if(!Number.isFinite(price)||price<=0)return no('unit-sanity',`price ${price} is not a positive number`);
    if(!Number.isFinite(ctx.oraclePrice)||ctx.oraclePrice<=0)return no('unit-sanity','oracle price is missing or not positive');
    const ratio=price/ctx.oraclePrice;
    if(ratio>5||ratio<0.2)return no('unit-sanity',`price ${price} is ${ratio.toFixed(1)}x the oracle price ${ctx.oraclePrice.toFixed(2)}; wrong unit?`);
    if(ctx.oracleAgeSec>L.maxOracleAgeSec)return no('max-oracle-age',`oracle is ${ctx.oracleAgeSec} s old, limit is ${L.maxOracleAgeSec} s`);
    if(sizeUsd>L.maxNotionalUsd)return no('max-notional',`${sizeUsd} USD exceeds the ${L.maxNotionalUsd} USD limit`);
    const gap=Math.abs(price-ctx.oraclePrice)/ctx.oraclePrice*1e4;
    if(gap>L.maxOracleGapBps)return no('max-oracle-gap',`price is ${gap.toFixed(1)} bps from the oracle, limit is ${L.maxOracleGapBps} bps`);
    return {ok:true,rule:null,reason:'within all limits'};
  }
  function oracleAt(reads,t){let best=null;for(const r of reads){if(r.t<=t)best=r;else break}return best}
  /* The sample project. swaps: [{t,price,usdcAmount}], reads: [{t,price,publishTime}] */
  function runAgent(swaps,reads,P){
    const bars=dollarBars(swaps,P.thresholdUsd);
    const cs=cusum(bars.map(b=>({t:b.tEnd,price:b.close})),P.cusumBps);
    const fired=cs.rows.filter(p=>p.sPos>P.cusumBps||p.sNeg<-P.cusumBps);
    const decisions=[],ledger=[],fm=[];let cash=0,pos=0,peak=0,dd=0,skipped=0;
    cs.events.forEach((ev,i)=>{
      const p=fired[i],bucket=ev.direction==='up'?p.sPos:-p.sNeg,rd=oracleAt(reads,ev.t);
      const order={side:ev.direction==='up'?'buy':'sell',sizeUsd:Math.round(bucket*P.usdPerBps),price:ev.price};
      const ctx={oraclePrice:rd.price,oracleAgeSec:Math.max(0,ev.t-rd.publishTime)};
      const decision=checkOrder(order,ctx,P.limits);
      const gapBps=Math.round(Math.abs(order.price-ctx.oraclePrice)/ctx.oraclePrice*1e4*10)/10;
      decisions.push({n:i+1,t:ev.t,direction:ev.direction,bucketBps:Math.round(bucket*100)/100,order,context:ctx,gapBps,decision});
      if(!decision.ok)return;
      const nx=swaps.find(s=>s.t>ev.t);if(!nx){skipped++;return}
      const qty=order.sizeUsd/nx.price,fee=order.sizeUsd*P.feeBps/1e4;
      if(order.side==='buy'){cash-=order.sizeUsd+fee;pos+=qty}else{cash+=order.sizeUsd-fee;pos-=qty}
      const eq=cash+pos*nx.price;peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq);
      fm.push({fill:nx.price,side:order.side,fee,size:order.sizeUsd});
      ledger.push({n:i+1,t:nx.t,side:order.side,sizeUsd:order.sizeUsd,fillPrice:nx.price,solQty:r6(qty),feeUsd:r2(fee),cashUsd:r2(cash),positionSol:r6(pos),equityUsd:r2(eq)});
    });
    const mark=swaps[swaps.length-1].price,byRule={};
    for(const d of decisions)if(!d.decision.ok)byRule[d.decision.rule]=(byRule[d.decision.rule]||0)+1;
    const wins=fm.filter(f=>((mark-f.fill)*(f.side==='buy'?1:-1))/f.fill*f.size-f.fee>0).length;
    return {bars:bars.length,events:cs.events.length,decisions,ledger,rows:cs.rows,barList:bars,
      scorecard:{events:decisions.length,accepted:decisions.filter(d=>d.decision.ok).length,rejected:decisions.filter(d=>!d.decision.ok).length,rejectedByRule:byRule,
        fills:ledger.length,skippedNoLaterSwap:skipped,pnlNetUsd:r2(cash+pos*mark),hitRate:fm.length?Math.round(wins/fm.length*1000)/1000:0,maxDrawdownUsd:r2(dd),markPrice:mark,positionSol:r6(pos)}};
  }
  /* Timer: status of one part, and the verdict for a rehearsal log {problem,what,proof,next} in seconds */
  const SEGS=[['problem','Problem',30],['what','What it does',35],['proof','Live proof',75],['next','Limit and next',40]];
  function segStatus(used,b){if(used==null||!Number.isFinite(used))return'missing';if(used>b+10)return'way-over';if(used>b)return'over';if(used<b/2)return'short';return'ok'}
  function timingVerdict(log){
    const segs=SEGS.map(([id,label,b])=>({id,label,budgetSec:b,usedSec:log[id]==null?null:log[id],status:segStatus(log[id],b)}));
    const total=segs.reduce((a,s)=>a+(s.usedSec||0),0),under=total<=180,noWay=segs.every(s=>s.status!=='way-over');
    return {segments:segs,totalSec:total,underTotal:under,noWayOver:noWay,pass:under&&noWay&&segs.every(s=>s.status!=='missing')};
  }
  /* Drill: one failed call is tried again; the third failure in a row switches to recorded */
  function nextState(s,ok){
    if(s.mode==='recorded')return {mode:'recorded',fails:s.fails,action:'none'};
    if(ok)return {mode:'live',fails:0,action:'continue'};
    const f=s.fails+1;
    return f>=3?{mode:'recorded',fails:f,action:'fallback'}:{mode:'live',fails:f,action:'retry'};
  }
  return {dollarBars,cusum,checkOrder,oracleAt,runAgent,segStatus,timingVerdict,nextState,LIMITS};
})();
if(typeof module!=='undefined')module.exports=CALC;
</script>
<script>/* Live mode: read-only public Solana data, straight from the browser. No keys, no wallets, no writes.
   Browser-safe RPC: solana-rpc.publicnode.com (api.mainnet.solana.com returns 403 for browser Origins). */
const LIVE=(()=>{
  const RPC_DEFAULT='https://solana-rpc.publicnode.com';let RPC=(typeof HASH!=='undefined'&&HASH.get('rpc'))||RPC_DEFAULT;
  /* setRpc(null) restores the default; the drill demo points it at a dead address to break the network on purpose */
  function setRpc(u){RPC=u||RPC_DEFAULT}
  const POOL='Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE',SOL_MINT='So11111111111111111111111111111111111111112',USDC_MINT='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
  const PYTH_ACCOUNT='7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE',PYTH_OWNER='rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ',PYTH_DISC='22f123639d7ef4cd';
  const A58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n>0n){s=A58[Number(n%58n)]+s;n/=58n}for(const x of b){if(x===0)s='1'+s;else break}return s}
  function fromB64(s){const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  const hex=(u,a,b)=>Array.from(u.slice(a,b),x=>x.toString(16).padStart(2,'0')).join('');
  let id=1;
  async function rpc(method,params){
    const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error){const e=new Error(j.error.message||'rpc error');e.rate=/429|rate|too many/i.test(JSON.stringify(j.error));throw e}
    return j.result;
  }
  async function account(addr){
    const r=await rpc('getAccountInfo',[addr,{encoding:'base64',commitment:'confirmed'}]);
    if(!r||!r.value)throw new Error('account not found');
    return {slot:r.context.slot,owner:r.value.owner,bytes:fromB64(r.value.data[0])};
  }
  /* Pyth SOL/USD PriceUpdateV2 account: price i64@73, conf i64@81, expo i32@89, publish time i64@93, posted slot u64@125 */
  async function fetchPythPrice(){
    const a=await account(PYTH_ACCOUNT);
    if(a.owner!==PYTH_OWNER)throw new Error('unexpected Pyth owner');
    const u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    if(u.length<133||hex(u,0,8)!==PYTH_DISC)throw new Error('not a Pyth price account');
    const expo=v.getInt32(89,true);
    return {price:Number(v.getBigInt64(73,true))*10**expo,publishTime:Number(v.getBigInt64(93,true)),postedSlot:Number(v.getBigUint64(125,true)),currentSlot:a.slot};
  }
  /* Orca whirlpool: sqrtPrice u128@65 (Q64.64); price = (sqrt/2^64)^2 * 10^(9-6) */
  async function fetchOrcaPrice(){
    const a=await account(POOL),u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    const sq=(v.getBigUint64(73,true)<<64n)|v.getBigUint64(65,true);
    const r=Number(sq)/2**64;return {price:r*r*1000,slot:a.slot};
  }
  async function fetchJupiterQuote(){
    const r=await fetch('https://lite-api.jup.ag/swap/v1/quote?inputMint='+SOL_MINT+'&outputMint='+USDC_MINT+'&amount=1000000000&slippageBps=50');
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();return {price:Number(j.outAmount)/1e6};
  }
  /* UI + loop. opts: {el, intervalMs=5000, enter(), exit(), poll(): Promise<{slot?,note?}> (throw on failure)} */
  function start(opts){
    const el=opts.el,every=opts.intervalMs||5000;
    el.innerHTML='';el.style.cssText='display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end';
    const grp=document.createElement('div');grp.setAttribute('role','group');grp.setAttribute('aria-label','Data source');grp.style.cssText='display:flex;gap:.4rem';
    const bR=document.createElement('button'),bL=document.createElement('button');bR.textContent='Recorded';bL.textContent='Live';
