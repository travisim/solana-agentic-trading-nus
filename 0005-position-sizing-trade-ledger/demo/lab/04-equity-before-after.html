<script>/* The same maths as code/src (sizing.ts, impact.ts, risk.ts, signals.ts, concurrency.ts, ledger.ts, simulate.ts), in plain JavaScript.

const CALC=(()=>{
const round=(x,d=6)=>Math.round(x*10**d)/10**d;
/* ---- sizing ---- */
function normCdf(x){const s=x<0?-1:1,a=Math.abs(x)/Math.SQRT2,t=1/(1+0.3275911*a);

function zOfP(p){return p<=0||p>=1?0:(p-0.5)/Math.sqrt(p*(1-p))}
function probToSize(p){if(!Number.isFinite(p)||p<=0.5)return 0;if(p>=1)return 1;return 2*normCdf(zOfP(p))-1}

function combineBets(ms,mode){if(!ms.length)return 0;const t=ms.reduce((a,b)=>a+b,0);return (mode||'average')==='average'?t/ms.length:Math.max(-1,Math.min(1,t))}
const targetUsdOf=(m,eq,maxFraction)=>m*maxFraction*Math.max(0,eq);
/* ---- price impact (linear between real Jupiter quotes) ---- */
function impactBpsFor(quotes,side,sizeUsd){
  const pts=quotes.filter(q=>q.side===side).sort((a,b)=>a.sizeUsd-b.sizeUsd);
  if(pts.length<2||!(sizeUsd>0))return 0;
  if(sizeUsd<=pts[0].sizeUsd)return pts[0].impactBps*sizeUsd/pts[0].sizeUsd;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(sizeUsd<=b.sizeUsd)return a.impactBps+(b.impactBps-a.impactBps)*(sizeUsd-a.sizeUsd)/(b.sizeUsd-a.sizeUsd)}

function maxSizeForImpact(quotes,side,maxBps,limitUsd=1e6){
  if(impactBpsFor(quotes,side,limitUsd)<=maxBps)return limitUsd;
  let lo=0,hi=limitUsd;for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(impactBpsFor(quotes,side,mid)<=maxBps)lo=mid;else hi=mid}return lo}
function capOrderByImpact(sizeUsd,side,quotes,maxBps){const allowed=maxSizeForImpact(quotes,side,maxBps),size=Math.min(sizeUsd,allowed);return {sizeUsd:size,capped:size<sizeUsd,impactBps:impactBpsFor(quotes,side,size),allowedUsd:allowed}}
/* ---- the risk hook from build night 1 ---- */
const DEFAULT_LIMITS={maxNotionalUsd:1000,maxOracleGapBps:50,maxOracleAgeSec:60};
function checkOrder(order,ctx,limits=DEFAULT_LIMITS){
  const ok=()=>({ok:true,rule:null,reason:'within all limits'}),no=(rule,reason)=>({ok:false,rule,reason});
  const {sizeUsd,price}=order;
  if(order.side!=='buy'&&order.side!=='sell')return no('unit-sanity',`side "${order.side}" is not buy or sell`);
  if(!Number.isFinite(sizeUsd)||sizeUsd<=0)return no('unit-sanity',`size ${sizeUsd} USD is not a positive number`);
  if(!Number.isFinite(price)||price<=0)return no('unit-sanity',`price ${price} is not a positive number`);
  if(!Number.isFinite(ctx.oraclePrice)||ctx.oraclePrice<=0)return no('unit-sanity','oracle price is missing or not positive');
  const ratio=price/ctx.oraclePrice;
  if(ratio>5||ratio<0.2)return no('unit-sanity',`price ${price} is ${ratio.toFixed(1)}x the oracle price ${ctx.oraclePrice.toFixed(2)}; wrong unit?`);
  if(ctx.oracleAgeSec>limits.maxOracleAgeSec)return no('max-oracle-age',`oracle is ${ctx.oracleAgeSec} s old, limit is ${limits.maxOracleAgeSec} s`);
  if(sizeUsd>limits.maxNotionalUsd)return no('max-notional',`${sizeUsd} USD exceeds the ${limits.maxNotionalUsd} USD limit`);
  const gap=Math.abs(price-ctx.oraclePrice)/ctx.oraclePrice*10000;
  if(gap>limits.maxOracleGapBps)return no('max-oracle-gap',`price is ${gap.toFixed(1)} bps from the oracle, limit is ${limits.maxOracleGapBps} bps`);

/* ---- signals ---- */
const DEFAULT_SIGNAL={lookback:12,volWindow:60,minZ:1.0,cooldownSec:30};
const confidenceOf=a=>0.5+0.45*(1-Math.exp(-a/2));
function makeSignals(times,px,sp=DEFAULT_SIGNAL){
  const out=[];let last=-Infinity;
  for(let i=Math.max(sp.lookback,10);i<px.length;i++){
    const t=times[i],from=Math.max(1,i-sp.volWindow+1);let ss=0,n=0;
    for(let j=from;j<=i;j++){const r=Math.log(px[j]/px[j-1]);ss+=r*r;n++}
    const sigma=Math.sqrt(ss/Math.max(1,n));if(!(sigma>0))continue;
    const z=Math.log(px[i]/px[i-sp.lookback])/(sigma*Math.sqrt(sp.lookback));
    if(Math.abs(z)<sp.minZ||t-last<sp.cooldownSec)continue;

/* ---- overlapping bets ---- */
const activeAt=(bets,t)=>bets.filter(b=>b.tOpen<=t&&t<b.tClose);
const concurrentCounts=(bets,times)=>times.map(t=>activeAt(bets,t).length);

  for(const b of bets){let s=0,n=0;times.forEach((t,i)=>{if(b.tOpen<=t&&t<b.tClose&&c[i]>0){s+=1/c[i];n++}});out.set(b.id,n?s/n:1)}return out}

const hashRow=(prev,body)=>sha256(prev+'\n'+JSON.stringify(body));
/* append-only: returns a NEW row chained to the previous one; nothing is ever edited */

/* ---- the whole loop (mirror of code/src/simulate.ts) ---- */
function oracleAgeProxy(times,px){const out=[];let last=times[0];times.forEach((t,i)=>{if(i>0&&px[i]!==px[i-1])last=t;out.push(t-last)});return out}

  const injectAt=cfg.injected?new Set([Math.floor(pts.length*0.35),Math.floor(pts.length*0.7)]):new Set();

const MINT='#3ddc97',LAV='#b3a5ff',WARN='#ffc15a',BAD='#ff7a85';
const cfg=()=>({sizing:{startUsd:P.startUsd,maxFraction:+cap.value/100,step:+st.value,maxImpactBps:P.maxImpactBps,minOrderUsd:P.minOrderUsd},signal:P.signal,limits:SZ.limits,horizonSec:+hz.value,combine:SUM?'sum':'average',feeBps:+fee.value,useImpact:IMP,injected:P.injected});
const refsEl=el('refs');
const SHORT={frictionless:'No costs',main:'With costs','small-cap':'Half the cap',sum:'Bets summed'};
EQ.runs.forEach(r=>{const b=H('button',{'aria-pressed':String(r.id===REF),'data-id':r.id,title:r.label},refsEl,SHORT[r.id]||r.label);b.addEventListener('click',()=>{REF=r.id;render()})});
function render(){
  const c=cfg();el('capo').textContent=Math.round(c.sizing.maxFraction*100)+'%';el('sto').textContent=c.sizing.step.toFixed(2);el('feeo').textContent=c.feeBps.toFixed(1)+' bps';el('hzo').textContent=c.horizonSec+' s';
  el('bImp').setAttribute('aria-pressed',IMP);el('bSum').setAttribute('aria-pressed',SUM);
  [...refsEl.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===REF));
  const after=CALC.simulate(SER,QUOTES,c),ref=EQ.runs.find(r=>r.id===REF);
  const T0=SER.points[0].t,T1=SER.points[SER.points.length-1].t,PL=70,PW=918,x=t=>PL+PW*(t-T0)/(T1-T0);
  const dRef=ref.curve.map(p=>p[1]-START),dAft=after.equity.map(e=>e.equityUsd-START);
  const lo=Math.min(...dRef,...dAft,0),hi=Math.max(...dRef,...dAft,0),pad=Math.max(0.5,(hi-lo)*0.12),y0=lo-pad,y1=hi+pad;
  const aT=24,aH=360,ya=v=>aT+aH*(1-(v-y0)/(y1-y0));
  const svg=el('ch');svg.innerHTML='';
  S('text',{x:PL,y:16,'font-size':18,class:'l'},svg,'Equity change since the start, USD (marked at the oracle price)');
  const step=niceStep((y1-y0)/4);for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step){S('line',{x1:PL,x2:PL+PW,y1:ya(v),y2:ya(v),stroke:Math.abs(v)<1e-9?'#4a4670':'#2c2c34'},svg);S('text',{x:PL-8,y:ya(v)+6,'text-anchor':'end','font-size':17,class:'m'},svg,(v>0?'+':'')+num2(v,step<1?2:0))}
  const line=(arr,col,w,dash)=>{let d='';arr.forEach((v,i)=>{d+=(i?'L':'M')+x(SER.points[i].t).toFixed(1)+','+ya(v).toFixed(1)});S('path',{d,fill:'none',stroke:col,'stroke-width':w,'stroke-dasharray':dash||''},svg)};
  line(dRef,LAV,2.4,'7 5');line(dAft,MINT,3);
  S('text',{x:PL+PW,y:aT+aH+30,'text-anchor':'end','font-size':17,class:'m'},svg,'Lavender dashed: before ('+(SHORT[ref.id]||ref.label)+').  Mint: after (your sliders).');
  [0,.25,.5,.75,1].forEach((f,i)=>S('text',{x:PL+PW*f,y:aT+aH+52,'text-anchor':i===0?'start':i===4?'end':'middle','font-size':17,class:'m'},svg,tlab(T0+(T1-T0)*f,T1-T0)));
  /* size held */
  const bT=aT+aH+88,bH=96,mx=Math.max(100,...ref.curve.map(p=>Math.abs(p[2])),...after.equity.map(e=>Math.abs(e.exposureUsd))),yb=v=>bT+bH/2-bH/2*v/mx;
  S('text',{x:PL,y:bT-8,'font-size':18,class:'l'},svg,'Size held in SOL, USD (above zero long, below zero short)');
  S('line',{x1:PL,x2:PL+PW,y1:yb(0),y2:yb(0),stroke:'#4a4670'},svg);S('text',{x:PL-8,y:yb(mx)+6,'text-anchor':'end','font-size':16,class:'m'},svg,'+'+num2(mx,0));S('text',{x:PL-8,y:yb(-mx)+6,'text-anchor':'end','font-size':16,class:'m'},svg,'-'+num2(mx,0));
  let d='';ref.curve.forEach((p,i)=>{d+=(i?'L':'M')+x(p[0]).toFixed(1)+','+yb(p[2]).toFixed(1)});S('path',{d,fill:'none',stroke:LAV,'stroke-width':1.6,'stroke-dasharray':'7 5'},svg);
  d='';after.equity.forEach((e,i)=>{d+=(i?'L':'M')+x(e.t).toFixed(1)+','+yb(e.exposureUsd).toFixed(1)});S('path',{d,fill:'none',stroke:MINT,'stroke-width':2.4},svg);
  /* table */
  const a=after.stats,b=ref.stats,box=el('tab');box.innerHTML='';
  H('div',{class:'lab'},box,'Before and after');
  const row=(l,f,bv,av,fmtf,better)=>{const r=H('div',{class:'kv num'},box);H('span',{},r,l);H('span',{style:'color:'+LAV},r,fmtf(bv));H('span',{style:'color:'+MINT},r,fmtf(av));
    const dlt=av-bv,same=fmtf(av)===fmtf(bv);H('span',{class:'mut',style:same||!better?'':'color:'+((better>0?dlt>0:dlt<0)?MINT:BAD)},r,same?'same':(dlt>0?'+':'')+fmtf(dlt))};
  const hd=H('div',{class:'kv hd'},box);['','Before','After','Change'].forEach(t=>H('span',{},hd,t));
  row('Final equity',0,b.finalEquityUsd,a.finalEquityUsd,v=>usd(v,2),1);
  row('Return',0,b.returnPct,a.returnPct,v=>num2(v,3)+'%',1);
  row('Worst drop',0,b.maxDrawdownPct,a.maxDrawdownPct,v=>num2(v,3)+'%',-1);
  row('Fees paid',0,b.feesUsd,a.feesUsd,v=>usd(v,2),-1);
  row('Impact cost',0,b.impactCostUsd,a.impactCostUsd,v=>usd(v,4),-1);
  row('Orders filled',0,b.filled,a.filled,v=>num2(v,0),0);
  row('Refused by hook',0,b.rejected,a.rejected,v=>num2(v,0),-1);
  row('Largest size',0,b.maxAbsExposureUsd,a.maxAbsExposureUsd,v=>usd(v,0),0);
  H('div',{class:'mut',style:'font-size:.85rem;margin-top:.45rem'},box,'The same recorded prices and the same signals in both. Green change = better for the account, red = worse.');
  el('chk').textContent='Simulated, on recorded data; not advice. This is a '+Math.round((T1-T0)/60)+'-minute window on one night, so a few dollars either way is noise, not a result. The before curves are the four runs in code/out/equity.json; the after curve is recomputed here by the same maths (verify.mjs checks both).';
}
const niceStep=r=>{const p=10**Math.floor(Math.log10(Math.max(r,1e-9))),m=r/p;return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p};
[cap,st,fee,hz].forEach(s=>s.addEventListener('input',render));
el('bImp').addEventListener('click',()=>{IMP=!IMP;render()});el('bSum').addEventListener('click',()=>{SUM=!SUM;render()});el('bRes').addEventListener('click',()=>{defaults();render()});
function foot_(){foot(el('src'),LV,'Prices: '+SERIES_DATES+'; price impact from real Jupiter quotes.'+(LV?' The strip on the right is live and is not part of the simulation.':''))}
/* live strip: current Orca pool price versus the Pyth oracle, in bps, next to the cost of trading. Not part of the simulation. */
const gaps=[];
LIVE.start({el:el('livebar'),
  enter:()=>{LV=true;gaps.length=0;el('lvbox').style.display='block';el('lvbox').textContent='Waiting for the first live reading...';foot_()},
  exit:()=>{LV=false;el('lvbox').style.display='none';foot_()},
  poll:async()=>{const [py,or]=await Promise.all([LIVE.fetchPythPrice(),LIVE.fetchOrcaPrice()]);
    const g=(or.price/py.price-1)*1e4;gaps.push(g);if(gaps.length>60)gaps.shift();
    const box=el('lvbox');box.innerHTML='';H('div',{class:'lab'},box,'Live, not part of the simulation');
    H('div',{class:'num',style:'font-size:1.05rem;margin:.2rem 0'},box,'Orca pool $'+num2(or.price,2)+' vs Pyth $'+num2(py.price,2));
    H('div',{class:'big num',style:'color:'+(Math.abs(g)>+fee.value*2?BAD:MINT)},box,(g>0?'+':'')+num2(g,1)+' bps');
    H('div',{class:'mut',style:'font-size:.9rem'},box,'A round trip costs about '+num2(+fee.value*2,1)+' bps in fees at your slider ('+num2(+fee.value,1)+' bps per fill). A gap smaller than that does not pay for itself.');
    const sv=S('svg',{viewBox:'0 0 300 60',style:'width:100%;height:auto;margin-top:.3rem'});box.appendChild(sv);
    const m=Math.max(5,+fee.value*2,...gaps.map(Math.abs)),yy=v=>30-26*v/m;
    S('line',{x1:0,x2:300,y1:30,y2:30,stroke:'#2c2c34'},sv);[1,-1].forEach(s=>S('line',{x1:0,x2:300,y1:yy(s*+fee.value*2),y2:yy(s*+fee.value*2),stroke:WARN,'stroke-dasharray':'4 3'},sv));
    let d='';gaps.forEach((v,i)=>{d+=(i?'L':'M')+(i*300/Math.max(1,gaps.length-1)).toFixed(1)+','+yy(v).toFixed(1)});S('path',{d,fill:'none',stroke:MINT,'stroke-width':2},sv);
    return {slot:py.currentSlot,note:'gap '+num2(g,1)+' bps'}}});
foot_();render();
</script></body></html>
