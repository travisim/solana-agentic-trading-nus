<script>/* The same maths as code/src (sizing.ts, impact.ts, risk.ts, signals.ts, concurrency.ts, ledger.ts, simulate.ts), in plain JavaScript.

const CALC=(()=>{

/* ---- price impact (linear between real Jupiter quotes) ---- */

/* ---- the risk hook from build night 1 ---- */
const DEFAULT_LIMITS={maxNotionalUsd:1000,maxOracleGapBps:50,maxOracleAgeSec:60};
function checkOrder(order,ctx,limits=DEFAULT_LIMITS){
  const ok=()=>({ok:true,rule:null,reason:'within all limits'}),no=(rule,reason)=>({ok:false,rule,reason});
  const {sizeUsd,price}=order;
  if(order.side!=='buy'&&order.side!=='sell')return no('unit-sanity',`side "${order.side}" is not buy or sell`);
  if(!Number.isFinite(sizeUsd)||sizeUsd<=0)return no('unit-sanity',`size ${sizeUsd} USD is not a positive number`);
  if(!Number.isFinite(price)||price<=0)return no('unit-sanity',`price ${price} is not a positive number`);
  if(!Number.isFinite(ctx.oraclePrice)||ctx.oraclePrice<=0)return no('unit-sanity','oracle price is missing or not positive');
  const ratio=price/ctx.oraclePrice;
  if(ratio>5||ratio<0.2)return no('unit-sanity',`price ${price} is ${ratio.toFixed(1)}x the oracle price ${ctx.oraclePrice.toFixed(2)}; wrong unit?`);
  if(ctx.oracleAgeSec>limits.maxOracleAgeSec)return no('max-oracle-age',`oracle is ${ctx.oracleAgeSec} s old, limit is ${limits.maxOracleAgeSec} s`);
  if(sizeUsd>limits.maxNotionalUsd)return no('max-notional',`${sizeUsd} USD exceeds the ${limits.maxNotionalUsd} USD limit`);
  const gap=Math.abs(price-ctx.oraclePrice)/ctx.oraclePrice*10000;
  if(gap>limits.maxOracleGapBps)return no('max-oracle-gap',`price is ${gap.toFixed(1)} bps from the oracle, limit is ${limits.maxOracleGapBps} bps`);

/* ---- signals ---- */
const DEFAULT_SIGNAL={lookback:12,volWindow:60,minZ:1.0,cooldownSec:30};
const confidenceOf=a=>0.5+0.45*(1-Math.exp(-a/2));
function makeSignals(times,px,sp=DEFAULT_SIGNAL){

  kv2('Largest size, averaged',num2(c.peakAvg*100,0)+'%',MINT);kv2('Largest size, summed',num2(c.peakSum*100,0)+'%',WARN);
  H('div',{class:'mut',style:'font-size:.85rem;margin-top:.4rem'},box,'Uniqueness 1.00: a bet never overlaps another. 0.25: its price move is shared with about four bets.');
  el('chk').textContent=LV?(D.times.length<14?'Live: collecting Pyth price ticks every 5 s; a signal needs about a minute of history and a move of at least 1 standard deviation. '+D.times.length+' ticks so far.':'Live: the same momentum signal and the same overlap maths, run on the Pyth price your browser is reading now. '+c.bets.length+' signals so far.')
   :'Recorded: bets from the code run (code/out/concurrency.json). Change the bet length and everything is recomputed here with the same maths as code/src (verify.mjs checks it at '+CN.horizonSec+' s).';
}
function foot_(){foot(el('src'),LV,LV?'Pyth SOL/USD read from the chain every 5 s.':'Prices: '+SERIES_DATES+', '+CN.bets.length+' signals from a simple momentum rule.')}
h.addEventListener('input',render);pos.addEventListener('input',render);
el('mAvg').addEventListener('click',()=>{MODE='average';render()});el('mSum').addEventListener('click',()=>{MODE='sum';render()});
let timer=null;const pl=el('play'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
pl.addEventListener('click',()=>{
  if(timer){clearInterval(timer);timer=null;pl.setAttribute('aria-pressed','false');pl.textContent='Play';return}
  if(rm){pos.value=pos.max;render();return}
  if(+pos.value>=+pos.max)pos.value=0;pl.setAttribute('aria-pressed','true');pl.textContent='Pause';
  timer=setInterval(()=>{pos.value=Math.min(+pos.max,+pos.value+4);render();if(+pos.value>=+pos.max){clearInterval(timer);timer=null;pl.setAttribute('aria-pressed','false');pl.textContent='Play'}},60)});
let live={times:[],px:[]};
LIVE.start({el:el('livebar'),
  enter:()=>{LV=true;if(timer){clearInterval(timer);timer=null;pl.setAttribute('aria-pressed','false');pl.textContent='Play'}pl.disabled=true;live={times:[],px:[]};const n0=Math.floor(Date.now()/1000);D={times:[n0,n0+5],bets:[]};pos.max=1;pos.value=1;foot_();render()},
  exit:()=>{LV=false;pl.disabled=false;D=REC;pos.max=D.times.length-1;pos.value=Math.round(.55*(D.times.length-1));foot_();render()},
  poll:async()=>{const r=await LIVE.fetchPythPrice();
    live.times.push(Math.floor(Date.now()/1000));live.px.push(r.price);if(live.times.length>120){live.times.shift();live.px.shift()}
    const sig=CALC.makeSignals(live.times,live.px,SZ.params.signal);
    D={times:live.times.slice(),bets:sig.map((s,i)=>({id:i+1,tOpen:s.t,side:s.side,p:s.p,m:s.side*CALC.probToSize(s.p)}))};
    if(D.times.length<2)D.times=[D.times[0],D.times[0]+5];
    pos.max=D.times.length-1;pos.value=pos.max;render();return {slot:r.currentSlot,note:'Pyth $'+num2(r.price,2)}}});
