const num2=(x,d=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});

<script>/* The same maths as code/src (sizing.ts, impact.ts, risk.ts, signals.ts, concurrency.ts, ledger.ts, simulate.ts), in plain JavaScript.

const CALC=(()=>{
const round=(x,d=6)=>Math.round(x*10**d)/10**d;
/* ---- sizing ---- */
function normCdf(x){const s=x<0?-1:1,a=Math.abs(x)/Math.SQRT2,t=1/(1+0.3275911*a);

function zOfP(p){return p<=0||p>=1?0:(p-0.5)/Math.sqrt(p*(1-p))}

const targetUsdOf=(m,eq,maxFraction)=>m*maxFraction*Math.max(0,eq);
/* ---- price impact (linear between real Jupiter quotes) ---- */
function impactBpsFor(quotes,side,sizeUsd){
  const pts=quotes.filter(q=>q.side===side).sort((a,b)=>a.sizeUsd-b.sizeUsd);
  if(pts.length<2||!(sizeUsd>0))return 0;
  if(sizeUsd<=pts[0].sizeUsd)return pts[0].impactBps*sizeUsd/pts[0].sizeUsd;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(sizeUsd<=b.sizeUsd)return a.impactBps+(b.impactBps-a.impactBps)*(sizeUsd-a.sizeUsd)/(b.sizeUsd-a.sizeUsd)}

  if(impactBpsFor(quotes,side,limitUsd)<=maxBps)return limitUsd;
  let lo=0,hi=limitUsd;for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(impactBpsFor(quotes,side,mid)<=maxBps)lo=mid;else hi=mid}return lo}
function capOrderByImpact(sizeUsd,side,quotes,maxBps){const allowed=maxSizeForImpact(quotes,side,maxBps),size=Math.min(sizeUsd,allowed);return {sizeUsd:size,capped:size<sizeUsd,impactBps:impactBpsFor(quotes,side,size),allowedUsd:allowed}}
/* ---- the risk hook from build night 1 ---- */
const DEFAULT_LIMITS={maxNotionalUsd:1000,maxOracleGapBps:50,maxOracleAgeSec:60};
function checkOrder(order,ctx,limits=DEFAULT_LIMITS){
  const ok=()=>({ok:true,rule:null,reason:'within all limits'}),no=(rule,reason)=>({ok:false,rule,reason});
  const {sizeUsd,price}=order;
  if(order.side!=='buy'&&order.side!=='sell')return no('unit-sanity',`side "${order.side}" is not buy or sell`);
  if(!Number.isFinite(sizeUsd)||sizeUsd<=0)return no('unit-sanity',`size ${sizeUsd} USD is not a positive number`);
  if(!Number.isFinite(price)||price<=0)return no('unit-sanity',`price ${price} is not a positive number`);
  if(!Number.isFinite(ctx.oraclePrice)||ctx.oraclePrice<=0)return no('unit-sanity','oracle price is missing or not positive');
  const ratio=price/ctx.oraclePrice;
  if(ratio>5||ratio<0.2)return no('unit-sanity',`price ${price} is ${ratio.toFixed(1)}x the oracle price ${ctx.oraclePrice.toFixed(2)}; wrong unit?`);
  if(ctx.oracleAgeSec>limits.maxOracleAgeSec)return no('max-oracle-age',`oracle is ${ctx.oracleAgeSec} s old, limit is ${limits.maxOracleAgeSec} s`);
  if(sizeUsd>limits.maxNotionalUsd)return no('max-notional',`${sizeUsd} USD exceeds the ${limits.maxNotionalUsd} USD limit`);
  const gap=Math.abs(price-ctx.oraclePrice)/ctx.oraclePrice*10000;
  if(gap>limits.maxOracleGapBps)return no('max-oracle-gap',`price is ${gap.toFixed(1)} bps from the oracle, limit is ${limits.maxOracleGapBps} bps`);

/* ---- signals ---- */
const DEFAULT_SIGNAL={lookback:12,volWindow:60,minZ:1.0,cooldownSec:30};
const confidenceOf=a=>0.5+0.45*(1-Math.exp(-a/2));
function makeSignals(times,px,sp=DEFAULT_SIGNAL){
  const out=[];let last=-Infinity;
  for(let i=Math.max(sp.lookback,10);i<px.length;i++){
    const t=times[i],from=Math.max(1,i-sp.volWindow+1);let ss=0,n=0;
    for(let j=from;j<=i;j++){const r=Math.log(px[j]/px[j-1]);ss+=r*r;n++}
    const sigma=Math.sqrt(ss/Math.max(1,n));if(!(sigma>0))continue;
    const z=Math.log(px[i]/px[i-sp.lookback])/(sigma*Math.sqrt(sp.lookback));
    if(Math.abs(z)<sp.minZ||t-last<sp.cooldownSec)continue;
    last=t;out.push({t,side:z>0?1:-1,z:Math.round(z*1000)/1000,p:Math.round(confidenceOf(Math.abs(z))*10000)/10000})}

/* ---- overlapping bets ---- */
const activeAt=(bets,t)=>bets.filter(b=>b.tOpen<=t&&t<b.tClose);
const concurrentCounts=(bets,times)=>times.map(t=>activeAt(bets,t).length);
function averageUniqueness(bets,times){const c=concurrentCounts(bets,times),out=new Map();
  for(const b of bets){let s=0,n=0;times.forEach((t,i)=>{if(b.tOpen<=t&&t<b.tClose&&c[i]>0){s+=1/c[i];n++}});out.set(b.id,n?s/n:1)}return out}

const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

    for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))>>>0;

const GENESIS='0'.repeat(64);
const hashRow=(prev,body)=>sha256(prev+'\n'+JSON.stringify(body));
/* append-only: returns a NEW row chained to the previous one; nothing is ever edited */
function appendRow(rows,input){const prevHash=rows.length?rows[rows.length-1].hash:GENESIS,head=Object.assign({seq:rows.length+1},input);

function replay(rows,startUsd){
  const errors=[];let cash=startUsd,pos=0,fees=0,fills=0,rejected=0,prev=GENESIS,firstBad=null;
  rows.forEach((r,i)=>{
    const bad=m=>{if(firstBad===null)firstBad=r.seq;if(errors.length<10)errors.push(`row ${r.seq}: ${m}`)};
    if(r.seq!==i+1)bad(`sequence is ${r.seq}, expected ${i+1}`);

    if(Math.abs(cash-r.cashUsd)>1e-6)bad(`cash is ${r.cashUsd} but the fills add up to ${cash.toFixed(6)}`);
    if(Math.abs(pos-r.posSol)>1e-9)bad(`position is ${r.posSol} SOL but the fills add up to ${pos.toFixed(9)}`);

/* ---- the whole loop (mirror of code/src/simulate.ts) ---- */
function oracleAgeProxy(times,px){const out=[];let last=times[0];times.forEach((t,i)=>{if(i>0&&px[i]!==px[i-1])last=t;out.push(t-last)});return out}
function simulate(series,quotes,cfg){

  const injectAt=cfg.injected?new Set([Math.floor(pts.length*0.35),Math.floor(pts.length*0.7)]):new Set();

  el('chk').textContent=LV?'Live: each row is a paper order made from the live Pyth price and Orca pool price your browser just read. Paper means nothing is sent anywhere. Every fourth row is a deliberate oversized test order, so you can watch the hook refuse it.'
    :(tampered?'Tampered copy: '+tampered+'. Press Reset to restore the real ledger.':'Recorded: '+REC.length+' rows from code/out/ledger.json. Try Edit a row or Delete a row, then look at the two checks on the right.');
}
function foot_(){foot(el('src'),LV,LV?'Pyth and Orca prices read now; hashes computed in your browser (SHA-256).':'Ledger from the code run on prices '+SERIES_DATES.replace('series captured','captured')+'; head hash '+LG.replay.headHash.slice(0,12)+'...')}
k.addEventListener('input',render);tr.addEventListener('input',render);
el('edit').addEventListener('click',()=>{const i=Math.min(+tr.value,ROWS.length)-1;if(i<0)return;const r=ROWS[i];
  if(r.fill){r.fill.price=Math.round((r.fill.price+1)*1e6)/1e6;tampered='row '+r.seq+' fill price changed by +1.00 USD'}else{r.order.sizeUsd+=1;tampered='row '+r.seq+' order size changed by +1 USD'}
  if(+k.value<r.seq)k.value=r.seq;render()});
el('del').addEventListener('click',()=>{const i=Math.min(+tr.value,ROWS.length)-1;if(i<0||ROWS.length<2)return;const r=ROWS[i];ROWS.splice(i,1);tampered='row '+r.seq+' deleted';sizeSliders();render()});
el('reset').addEventListener('click',()=>{ROWS=LV?liveRows:structuredClone(REC);tampered=null;sizeSliders();render()});
let timer=null;const pl=el('play'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
pl.addEventListener('click',()=>{
  if(timer){clearInterval(timer);timer=null;pl.setAttribute('aria-pressed','false');pl.textContent='Play';return}
  if(rm){k.value=k.max;render();return}
  if(+k.value>=+k.max)k.value=0;pl.setAttribute('aria-pressed','true');pl.textContent='Pause';
  timer=setInterval(()=>{k.value=Math.min(+k.max,+k.value+1);render();if(+k.value>=+k.max){clearInterval(timer);timer=null;pl.setAttribute('aria-pressed','false');pl.textContent='Play'}},450)});
/* ---- live: paper orders from the live Pyth and Orca prices, appended to a fresh hash chain ---- */
let liveRows=[],n=0,state={cash:START,pos:0};
function liveAppend(py,orca){
  if(liveRows.length>=60)return;
  n++;const now=Math.floor(Date.now()/1000),age=Math.max(0,now-py.publishTime),inj=n%4===0;
  const side=inj?'buy':(n%2?'buy':'sell'),sizeUsd=inj?5000:300,price=orca;
  const verdict=CALC.checkOrder({side,sizeUsd,price},{oraclePrice:py.price,oracleAgeSec:age},LIM);
  let fill=null;
  if(verdict.ok){const sg=side==='buy'?1:-1,ib=CALC.impactBpsFor(QUOTES,side,sizeUsd),fp=price*(1+sg*ib/1e4),fee=SZ.params.feeBps/1e4*sizeUsd;
    fill={price:CALC.round(fp),qtySol:CALC.round(sizeUsd/fp,9),impactBps:CALC.round(ib,4),feeUsd:CALC.round(fee)};state.cash-=sg*fill.qtySol*fill.price+fill.feeUsd;state.pos+=sg*fill.qtySol}
  liveRows=liveRows.concat([CALC.appendRow(liveRows,{t:now,trigger:inj?'injected':'signal-open',note:inj?'LIVE paper: oversized test order (5000 USD)':'LIVE paper order, 300 USD '+side,activeBets:0,targetFraction:0,targetUsd:0,currentUsd:0,
    order:{side,sizeUsd,price:CALC.round(price)},oraclePrice:py.price,oracleAgeSec:age,verdict,fill,cashUsd:CALC.round(state.cash),posSol:CALC.round(state.pos,9),equityUsd:CALC.round(state.cash+state.pos*py.price,4)})]);}
LIVE.start({el:el('livebar'),
  enter:()=>{LV=true;if(timer){clearInterval(timer);timer=null;pl.setAttribute('aria-pressed','false');pl.textContent='Play'}liveRows=[];n=0;state={cash:START,pos:0};ROWS=[];tampered=null;sizeSliders();k.value=0;foot_();render()},
  exit:()=>{LV=false;ROWS=structuredClone(REC);tampered=null;sizeSliders();k.value=12;foot_();render()},
  poll:async()=>{const [py,or]=await Promise.all([LIVE.fetchPythPrice(),LIVE.fetchOrcaPrice()]);
    liveAppend(py,or.price);ROWS=tampered?ROWS:liveRows.slice();sizeSliders();k.value=ROWS.length;render();return {slot:py.currentSlot,note:ROWS.length+' rows'}}});
foot_();render();
if(hv('tamper','')==='edit')el('edit').click();else if(hv('tamper','')==='del')el('del').click();
</script></body></html>
