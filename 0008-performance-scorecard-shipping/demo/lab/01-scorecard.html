<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorecard from a Ledger</title>
<style>/* Shared look: Workshop 1 deck (black, lavender, mint, thin-outline rounded boxes). No libraries, no web fonts. */
:root{
  --bg:#000; --fg:#f4f4f6; --muted:#9a9aa2; --lav:#b3a5ff; --mint:#3ddc97; --warn:#ffc15a; --bad:#ff7a85;
  --line:#4a4670; --line-soft:#2c2c34; --card:#07070b;
  --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-contrast:more){:root{--muted:#cfcfd6;--line:#8d82d6;--line-soft:#6a6a76}}
*{box-sizing:border-box}
html{font-size:clamp(12px,min(1.25vw,2.05vh),22px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:300;line-height:1.3;min-height:100vh}
.page{max-width:1800px;margin:0 auto;padding:1.1rem 3rem .8rem;display:flex;flex-direction:column;height:100vh;gap:.6rem}
h1{font-weight:300;font-size:2.8rem;line-height:1.05;margin:0;letter-spacing:-.01em}
.cap{color:var(--lav);font-size:1.3rem;margin:0;font-weight:300}
.src{color:var(--muted);font-size:.72rem;margin-top:auto;padding-top:.3rem;flex:none;display:flex;justify-content:space-between;gap:1rem}
.src .fx{color:var(--warn)}
main{flex:1;display:flex;flex-direction:column;gap:.8rem;min-height:0}
.box{border:1.5px solid var(--line);border-radius:.9rem;background:var(--card);padding:.8rem 1.1rem}
.box.mint{border-color:var(--mint)} .box.warn{border-color:var(--warn)} .box.bad{border-color:var(--bad)} .box.lav{border-color:var(--lav)}
.lab{color:var(--lav);font-size:1.05rem}
.big{font-size:2rem;font-weight:300}
.mut{color:var(--muted)} .mint{color:var(--mint)} .lavc{color:var(--lav)} .badc{color:var(--bad)} .warnc{color:var(--warn)}
.row{display:flex;gap:1rem;align-items:center}
.grid{display:grid;gap:1rem}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;border:1.5px solid currentColor;border-radius:99px;padding:.05rem .7rem;font-size:.95rem;white-space:nowrap}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font);font-weight:300;fill:var(--fg)}
svg .m{fill:var(--muted)} svg .l{fill:var(--lav)}
/* controls */
.ctl{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr 6.5rem;align-items:center;gap:1rem;font-size:1.1rem}
.ctl output{text-align:right;color:var(--mint);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.2rem;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:4px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--mint);border:2px solid #000;margin-top:calc(-.75rem + 2px)}
input[type=range]::-moz-range-thumb{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--mint);border:2px solid #000}
:focus-visible{outline:3px solid var(--warn);outline-offset:3px;border-radius:.4rem}
input[type=range]:focus-visible{outline-offset:0}
button{font:inherit;font-size:1.05rem;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;cursor:pointer}
button:hover{border-color:var(--lav)}
button[aria-pressed=true],button[aria-checked=true]{border-color:var(--mint);color:var(--mint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tr{transition:all .25s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* live mode bar (shared/live.js) */
.page{position:relative}
.livebar{position:absolute;top:1.1rem;right:3rem;display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;font-size:1rem;z-index:2}
.livebar .lvtop,.livebar .lvsub{display:flex;align-items:center;gap:.6rem}
.livebar .seg{display:inline-flex}
.livebar .seg button{font-size:1rem;padding:.15rem .9rem;border-radius:0;margin:0}
.livebar .seg button:first-child{border-radius:.7rem 0 0 .7rem}
.livebar .seg button:last-child{border-radius:0 .7rem .7rem 0;margin-left:-1.5px}
.livebar .lvtxt{font-size:.8rem}
.livebar .pill{font-size:.85rem}
.livebar [hidden]{display:none}
.livestrip{border-color:var(--mint)}
.livestrip .tag{color:var(--mint);font-size:.9rem;border:1.5px solid var(--mint);border-radius:99px;padding:0 .6rem;margin-right:.5rem}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.kpi{border:1.5px solid var(--line);border-radius:.9rem;background:var(--card);padding:.5rem .9rem}
.kpi .k{color:var(--lav);font-size:.95rem}.kpi .v{font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums}.kpi .s{color:var(--muted);font-size:.85rem}
.kpi.good{border-color:var(--mint)}.kpi.bad{border-color:var(--bad)}.kpi.warn{border-color:var(--warn)}
.kpi.good .v{color:var(--mint)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.sel{display:flex;gap:.4rem;flex-wrap:wrap}.sel button{padding:.35rem .8rem;font-size:1rem}.top{padding:.45rem 1.1rem}
.top{display:grid;grid-template-columns:2.3fr 1fr 1fr;gap:1.2rem;align-items:center}
</style></head><body>
<div class="page">
<h1>Scorecard from a ledger</h1>
<p class="cap">The trades never change. Drag the cost sliders and watch the verdict flip.</p>
<main id="main" aria-label="Scorecard demo">
<div class="box top">
  <div class="sel" id="sel" role="group" aria-label="Choose a strategy"></div>
  <div class="ctl" style="grid-template-columns:5rem 1fr 4.6rem"><label for="fee">Fee</label><input id="fee" type="range" min="0" max="15" step="0.5" aria-label="Trading fee in basis points per leg"><output id="feeo" for="fee"></output></div>
  <div class="ctl" style="grid-template-columns:6.5rem 1fr 4.6rem"><label for="slip">Slippage</label><input id="slip" type="range" min="0" max="15" step="0.5" aria-label="Slippage in basis points per leg"><output id="slipo" for="slip"></output></div>
</div>
<div class="kpis" id="kpis"></div>
<div class="box" style="flex:1;min-height:0;display:flex;flex-direction:column;padding:.5rem 1rem">
  <div class="row" style="justify-content:space-between"><span class="lab" id="ledtitle"></span><span class="mut" style="font-size:.85rem">bar = net P&amp;L of one trade, lavender tick = gross before costs</span></div>
  <svg id="led" viewBox="0 0 1600 250" role="img" aria-label="Net profit and loss of each trade in the ledger" style="flex:1;min-height:0"></svg>
</div>
<div class="box livestrip" id="strip" aria-live="polite" hidden></div>
</main>
<div class="src" id="src"></div>
</div>

  }
  function tickStats(prices, c) { /* every live tick = one 1000 USD long for one tick (cost: both legs) */

  }

<script>/* Live mode for the lab demos. Plain JS, no libraries, inlined into every demo by build.mjs.
 * Reads only: public Solana RPC, the Jupiter quote API, and two on-chain accounts (Pyth price, Orca pool).
 * No keys, no wallets, no writes. Recorded data stays the default; Live is opt-in.
 *
 * Browser-safe endpoints (tested Oct 22, 2026):
 *   RPC      https://solana-rpc.publicnode.com   (CORS open; api.mainnet.solana.com returns 403 to browser origins)
 *   Jupiter  https://lite-api.jup.ag/swap/v1/quote
 * The decoders below are plain-JS ports of demo-repo/code/src/collectors/{jupiter,pyth,orca}.ts.
 *
 * Test switches (URL): ?live=1 starts live. &fail=N makes the Nth live tick fail, to test the fallback (fail=1: first tick).
 */
const LIVE=(()=>{
const RPC='https://solana-rpc.publicnode.com';
const SOL='So11111111111111111111111111111111111111112', USDC='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
const JUP_URL='https://lite-api.jup.ag/swap/v1/quote?inputMint='+SOL+'&outputMint='+USDC+'&amount=1000000000&slippageBps=50';
const PYTH_PROGRAM='rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ', PYTH_ACCOUNT='7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE';
const PYTH_FEED='ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d', PYTH_DISC='22f123639d7ef4cd';
const WHIRL_PROGRAM='whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc', ORCA_POOL='Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE';
const POLL_MS=5000, MAX_POINTS=120, TIMEOUT_MS=8000;
const params=new URLSearchParams(location.search+'&'+location.hash.slice(1));
const FAIL_AT=params.has('fail')?(+params.get('fail')||1):0;

class RateLimit extends Error{constructor(h){super('HTTP 429 (rate limited) from '+h);this.rate=true}}
async function getJson(url,init){
  const host=new URL(url).host, ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),TIMEOUT_MS);
  try{const r=await fetch(url,Object.assign({signal:ctl.signal},init));
    if(r.status===429)throw new RateLimit(host);
    if(!r.ok)throw new Error('HTTP '+r.status+' from '+host);
    return await r.json()}
  catch(e){if(e.name==='AbortError')throw new Error('timeout from '+host);throw e}
  finally{clearTimeout(to)}
}
async function getAccount(address){
  const j=await getJson(RPC,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({jsonrpc:'2.0',id:1,method:'getAccountInfo',params:[address,{encoding:'base64',commitment:'confirmed'}]})});
  if(j.error)throw new Error('RPC error: '+j.error.message);
  const v=j.result&&j.result.value; if(!v)throw new Error('account '+address+' not found');
  const bin=atob(v.data[0]), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return {bytes,owner:v.owner,slot:j.result.context.slot};
}
const ALPHA='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function base58(bytes){let n=0n;for(const b of bytes)n=(n<<8n)|BigInt(b);let o='';while(n>0n){o=ALPHA[Number(n%58n)]+o;n/=58n}

const hex=(b,a,z)=>Array.from(b.slice(a,z),x=>x.toString(16).padStart(2,'0')).join('');

/* venue price: what 1 SOL sells for, routed by Jupiter */
async function fetchJupiterQuote(){
  const q=await getJson(JUP_URL); if(!q.outAmount)throw new Error('Jupiter quote had no outAmount');
  return {price:Number(q.outAmount)/1e6};
}
/* oracle price: the Pyth PriceUpdateV2 account, decoded from raw bytes (layout in code/src/collectors/pyth.ts) */
async function fetchPythPrice(){
  const a=await getAccount(PYTH_ACCOUNT), b=a.bytes;
  if(a.owner!==PYTH_PROGRAM)throw new Error('unexpected Pyth account owner');
  if(b.length<133||hex(b,0,8)!==PYTH_DISC)throw new Error('not a Pyth PriceUpdateV2 account');
  if(hex(b,41,73)!==PYTH_FEED)throw new Error('Pyth account holds a different feed');
  const v=new DataView(b.buffer,b.byteOffset,b.byteLength), exp=v.getInt32(89,true);
  const price=Number(v.getBigInt64(73,true))*10**exp, conf=Number(v.getBigInt64(81,true))*10**exp;
  return {price,confBps:conf/price*1e4,publishTime:Number(v.getBigInt64(93,true)),postedSlot:Number(v.getBigUint64(125,true)),slot:a.slot};
}
/* pool price: Orca Whirlpool SOL/USDC, price from sqrtPrice (Q64.64) (layout in code/src/collectors/orca.ts) */
async function fetchOrcaPrice(){
  const a=await getAccount(ORCA_POOL), b=a.bytes;
  if(a.owner!==WHIRL_PROGRAM)throw new Error('unexpected pool owner');
  if(b.length<213)throw new Error('Whirlpool account too short');
  if(base58(b.slice(101,133))!==SOL||base58(b.slice(181,213))!==USDC)throw new Error('pool is not SOL/USDC');
  const v=new DataView(b.buffer,b.byteOffset,b.byteLength);
  const sq=v.getBigUint64(65,true)|(v.getBigUint64(73,true)<<64n), root=Number(sq)/2**64;
  return {price:root*root*1e3,slot:a.slot};
}
/* one tick: all three reads in parallel, one snapshot out */
let tickNo=0; const JUP={q:null,at:0,note:null}, JUP_EVERY_MS=20000;
async function fetchSnapshot(){
  if(FAIL_AT&&++tickNo>=FAIL_AT)throw new RateLimit('forced-failure.test (?fail='+FAIL_AT+')');
  // Jupiter's free quote API throttles per IP (a whole classroom shares one), so ask it at most every 20 s and
  // keep going on the last quote (or the pool price) if it says 429. Only Pyth/Orca RPC failures fall back to recorded.
  const jupP=(Date.now()-JUP.at<JUP_EVERY_MS&&JUP.q)?Promise.resolve(null):fetchJupiterQuote().then(q=>{JUP.q=q;JUP.at=Date.now();JUP.note=null;return q},e=>{JUP.at=Date.now()-JUP_EVERY_MS+5000;JUP.note=e&&e.rate?'Jupiter throttled, using last quote':'Jupiter unavailable, using last quote';return null});
  const [,p,o]=await Promise.all([jupP,fetchPythPrice(),fetchOrcaPrice()]);
  const t=Math.floor(Date.now()/1000);
  const jup=JUP.q?JUP.q.price:o.price;
  return {t,jupiter:jup,jupiterNote:JUP.q?JUP.note:(JUP.note||'Jupiter unavailable, showing pool price'),pyth:p.price,orca:o.price,confBps:p.confBps,publishTime:p.publishTime,postedSlot:p.postedSlot,
    slot:Math.max(p.slot,o.slot),oracleAgeSec:Math.max(0,t-p.publishTime)};
}

/* Workshop 4 additions: devnet reads for the ship-check demo. Public devnet RPC, read only, no keys.
 * getSignatureStatuses tells whether a transaction signature found in a README really landed on devnet. */
const DEVNET_RPC='https://api.devnet.solana.com';
async function devnetCall(method,params){
  const j=await getJson(DEVNET_RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
  if(j.error)throw new Error('RPC error: '+j.error.message); return j.result;
}
function b58len(str){let n=0n;for(const ch of str){const i=ALPHA.indexOf(ch);if(i<0)return -1;n=n*58n+BigInt(i)}let len=0;while(n>0n){len++;n>>=8n}for(const ch of str){if(ch!=='1')break;len++}return len}
async function fetchDevnetStatuses(sigs){

  const list=sigs.slice(0,20), valid=list.filter(s=>b58len(s)===64); let st={};

function paint(extra){

function schedule(ms){clearTimeout(S.timer);S.timer=null;if(S.live&&!document.hidden)S.timer=setTimeout(tick,ms)}
async function tick(){
  if(!S.live||S.busy||document.hidden)return;

    const snap=await (S.fetcher||fetchSnapshot)(); if(!S.live)return;

function startLive(onTick,opts){
  opts=opts||{}; S.fetcher=opts.fetcher||null; S.onTick=onTick; S.onMode=opts.onMode||null; if(opts.recordedNote)S.recNote=opts.recordedNote;
