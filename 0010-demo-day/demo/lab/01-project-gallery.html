<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Gallery</title>
<style>/* Shared look: Workshop 1 deck (black, lavender, mint, thin-outline rounded boxes). No libraries, no web fonts. */
:root{
  --bg:#000; --fg:#f4f4f6; --muted:#9a9aa2; --lav:#b3a5ff; --mint:#3ddc97; --warn:#ffc15a; --bad:#ff7a85;
  --line:#4a4670; --line-soft:#2c2c34; --card:#07070b;
  --font:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-contrast:more){:root{--muted:#cfcfd6;--line:#8d82d6;--line-soft:#6a6a76}}
*{box-sizing:border-box}
html{font-size:clamp(12px,min(1.25vw,2.05vh),22px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:300;line-height:1.3;min-height:100vh}
.page{max-width:1800px;margin:0 auto;padding:1.1rem 3rem .8rem;display:flex;flex-direction:column;height:100vh;gap:.6rem}
h1{font-weight:300;font-size:2.8rem;line-height:1.05;margin:0;letter-spacing:-.01em}
.cap{color:var(--lav);font-size:1.3rem;margin:0;font-weight:300}
.src{color:var(--muted);font-size:.72rem;margin-top:auto;padding-top:.3rem;flex:none;display:flex;justify-content:space-between;gap:1rem}
.src .fx{color:var(--warn)}
main{flex:1;display:flex;flex-direction:column;gap:.8rem;min-height:0}
.box{border:1.5px solid var(--line);border-radius:.9rem;background:var(--card);padding:.8rem 1.1rem}
.box.mint{border-color:var(--mint)} .box.warn{border-color:var(--warn)} .box.bad{border-color:var(--bad)} .box.lav{border-color:var(--lav)}
.lab{color:var(--lav);font-size:1.05rem}
.big{font-size:2rem;font-weight:300}
.mut{color:var(--muted)} .mint{color:var(--mint)} .lavc{color:var(--lav)} .badc{color:var(--bad)} .warnc{color:var(--warn)}
.row{display:flex;gap:1rem;align-items:center}
.grid{display:grid;gap:1rem}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;border:1.5px solid currentColor;border-radius:99px;padding:.05rem .7rem;font-size:.95rem;white-space:nowrap}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font);font-weight:300;fill:var(--fg)}
svg .m{fill:var(--muted)} svg .l{fill:var(--lav)}
/* controls */
.ctl{display:grid;grid-template-columns:minmax(8rem,14rem) 1fr 6.5rem;align-items:center;gap:1rem;font-size:1.1rem}
.ctl output{text-align:right;color:var(--mint);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.2rem;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:4px}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--mint);border:2px solid #000;margin-top:calc(-.75rem + 2px)}
input[type=range]::-moz-range-thumb{width:1.5rem;height:1.5rem;border-radius:50%;background:var(--mint);border:2px solid #000}
:focus-visible{outline:3px solid var(--warn);outline-offset:3px;border-radius:.4rem}
input[type=range]:focus-visible{outline-offset:0}
button{font:inherit;font-size:1.05rem;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;cursor:pointer}
button:hover{border-color:var(--lav)}
button[aria-pressed=true],button[aria-checked=true]{border-color:var(--mint);color:var(--mint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tr{transition:all .25s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.lvwrap{margin-left:auto;padding-top:.5rem}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(25rem,1fr));gap:1rem;overflow:auto;min-height:0;flex:1;align-content:start;padding:.2rem}
.card{display:flex;flex-direction:column;gap:.45rem}
.card h2{font-weight:300;font-size:1.45rem;margin:0}
.card p{margin:0;font-size:1rem;color:#d9d9de}
.chip{border:1.5px solid var(--line);border-radius:.7rem;padding:.35rem .7rem;font-size:.95rem;display:flex;gap:.6rem;justify-content:space-between;align-items:center}

.chip.ok{border-color:var(--mint)} .chip.warn{border-color:var(--warn)} .chip.bad{border-color:var(--bad)}
.bar{height:.4rem;border-radius:.4rem;background:var(--line-soft);overflow:hidden;width:5rem;flex:none}.bar i{display:block;height:100%;background:var(--mint)}
.tb{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.card a{color:var(--lav);margin-right:1.2rem;font-size:1.05rem}
.lane-agent{color:var(--lav)}.lane-exchange{color:var(--mint)}.lane-tooling{color:var(--warn)}
#issues{font-size:.85rem;color:var(--warn);margin:0;padding:0 0 0 1.1rem;max-height:5rem;overflow:auto}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
label.btn{font-size:1.05rem;border:1.5px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;cursor:pointer;background:var(--card)}
label.btn:hover,input:focus-visible+label.btn{border-color:var(--lav)}
</style></head><body>
<div class="page">
<div class="row" style="align-items:flex-start;justify-content:space-between"><h1>Project gallery</h1><div id="livebar" class="lvwrap"></div></div>
<p class="cap">Every project in projects.json, with its lane, repo, demo and evidence. Filter by lane, or load your own file.</p>
<main id="main" aria-label="Project gallery demo">
<div class="tb">
  <div role="group" aria-label="Filter by lane" id="filters" class="row" style="gap:.5rem"></div>
  <span style="flex:1"></span>
  <input type="file" id="file" accept=".json,application/json" aria-label="Load a projects.json file from your computer"><label class="btn" for="file">Load your projects.json</label>
  <button id="reset" type="button" hidden>Back to the template</button>
</div>
<div class="row" style="justify-content:space-between;gap:1rem"><div id="status" class="pill mut"></div><div id="pulse"></div></div>
<ul id="issues" hidden></ul>
<div class="cards" id="cards" aria-live="polite"></div>
</main>
<div class="src" id="src"></div>
</div>
<script>const NS="http://www.w3.org/2000/svg";
const $=(s,r=document)=>r.querySelector(s);
function S(tag,attrs={},parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
function H(tag,attrs={},parent,text){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e}
const HASH=new URLSearchParams(location.hash.slice(1));
const hv=(k,d)=>HASH.has(k)?HASH.get(k):d;
const bps=(a,b)=>(a/b-1)*1e4;
const f2=(x,n=2)=>Number(x).toFixed(n);
function dateOf(sec){return new Date(sec*1000).toISOString().replace('T',' ').slice(0,16)+' UTC'}
const sgt=sec=>new Date((sec+8*3600)*1000).toISOString().replace('T',' ').slice(0,16)+' SGT';
/* footer caption: says whether the data is recorded/live/fixture, its capture date, and what the page shows.
   opts.sim = extra sentence flagging a simulated element. */
function sourceLine(el,data,what,ts,opts={}){
  const vals=Object.values(data);
  const fx=vals.some(d=>d&&d.fixture);
  const d0=vals.find(d=>d.capturedAt||d.generatedAt)||vals[0];
  const mode=d0.mode||'recorded';
  const iso=(d0.capturedAt||d0.generatedAt||'');
  const when=iso?sgt(Date.parse(iso)/1000):(ts?sgt(ts):'date unknown');
  el.innerHTML='';
  const a=H('span',{},el);
  if(fx){H('span',{class:'fx'},a,'PLACEHOLDER FIXTURE DATA, not real. ')}
  else a.append((mode==='live'?'Live data':'Recorded data (not live)')+', captured '+when+'. ');
  a.append(what+' Public mainnet reads, no keys.');
  if(opts.sim)H('span',{class:'fx'},a,' '+opts.sim);
  H('span',{style:'white-space:nowrap'},el,'Demo Day');
}
function tlab(t,span){const s=new Date((t+28800)*1000).toISOString();return span<600?s.slice(11,19):s.slice(11,16)}

/* Slot pulse: a small strip that shows the Solana mainnet slot. Recorded: the captured read. Live: the latest read, with how far it moved. */
function makePulse(el){
  el.innerHTML='';el.style.cssText='display:flex;align-items:center;gap:.6rem;font-size:.95rem';
  const dot=H('span',{style:'width:.7rem;height:.7rem;border-radius:50%;border:1.5px solid var(--muted);display:inline-block;flex:none'},el);
  const txt=H('span',{class:'num mut','aria-live':'off'},el);
  let last=null;
  return {
    recorded(net){last=null;dot.style.background='transparent';dot.style.borderColor='var(--muted)';
      txt.className='num mut';txt.textContent='Mainnet slot '+Number(net.slot).toLocaleString('en-US')+' (recorded '+sgt(Date.parse(net.capturedAt)/1000).slice(5)+(net.slotsPerSecond?', about '+f2(net.slotsPerSecond,1)+' slots per second':'')+')'},
    live(slot){const now=Date.now();let extra='';
      if(last&&slot>=last.slot&&now>last.t){const dt=(now-last.t)/1000;extra=' · +'+(slot-last.slot)+' in '+f2(dt,1)+' s · about '+f2((slot-last.slot)/dt,1)+' slots per second'}
      last={slot,t:now};dot.style.background='var(--mint)';dot.style.borderColor='var(--mint)';
      txt.className='num mint';txt.textContent='Mainnet slot '+slot.toLocaleString('en-US')+extra},
    waiting(){txt.className='num mut';txt.textContent='Mainnet slot: waiting for the first live read...'},
  };
}
</script>
<script>/* Pure functions used by the demos (browser) and by verify.mjs (Node). Ports of ../code/src/{validate,rubric,schedule}.ts; verify.mjs checks they agree. No DOM, no dependencies. */
const CALC=(()=>{
  const LANES=['agent','exchange','tooling'];
  const B58=/^[1-9A-HJ-NP-Za-km-z]+$/,ID=/^[a-z0-9][a-z0-9-]{1,40}$/,HANDLE=/^@?[A-Za-z0-9_-]{2,39}$/;
  const RETURNS=/\b(returns?|profit|profits|profitable|apy|apr|roi|pnl|gains?|alpha)\b/i;
  const SECRET_KEYS=/^(privatekey|secretkey|secret|seed|seedphrase|mnemonic|apikey|password|token)$/i;
  const KNOWN=new Set(['id','name','lane','team','summary','repo','demo','devnetSignature','programId','tests','limitation','example']);
  const isObj=x=>typeof x==='object'&&x!==null&&!Array.isArray(x);
  function httpsUrl(v){
    if(typeof v!=='string')return 'must be a text link';
    let u;try{u=new URL(v)}catch(e){return 'is not a valid link'}
    return u.protocol!=='https:'?'must start with https://':null;
  }
  /* same rules, same messages as validate.ts */
  function validate(input){
    const errors=[],warnings=[],counts={projects:0,agent:0,exchange:0,tooling:0};
    const err=(id,field,message)=>errors.push({id,field,message}),warn=(id,field,message)=>warnings.push({id,field,message});
    if(!isObj(input)){err('(file)','(root)','the file must be a JSON object with an event and a projects list');return {ok:false,errors,warnings,counts}}
    if(typeof input.event!=='string'||!input.event.trim())err('(file)','event','needs an event name');
    const list=input.projects;
    if(!Array.isArray(list)||list.length===0){err('(file)','projects','needs a non-empty projects list');return {ok:false,errors,warnings,counts}}
    counts.projects=list.length;
    if(list.length>7)warn('(file)','projects',list.length+' projects but only 7 five-minute slots fit between 18:20 and 18:55; the rest need a lightning slot or the peer gallery');
    const seen=new Set();
    list.forEach((raw,i)=>{
      if(!isObj(raw))return err('#'+(i+1),'(entry)','each project must be an object');
      const id=typeof raw.id==='string'&&raw.id?raw.id:'#'+(i+1),example=raw.example===true;
      if(typeof raw.id!=='string'||!ID.test(raw.id))err(id,'id','use lowercase letters, digits and dashes (2 to 41 characters)');
      else if(seen.has(raw.id))err(id,'id','duplicate id');else seen.add(raw.id);
      for(const k of Object.keys(raw)){
        if(SECRET_KEYS.test(k))err(id,k,'never put keys, seed phrases or tokens in this file. Remove it and rotate anything that was real');
        else if(!KNOWN.has(k))warn(id,k,'unknown field, ignored');
      }
      const text=(k,min,max)=>{const v=raw[k];if(typeof v!=='string'||v.trim().length<min||v.trim().length>max)err(id,k,'needs text of '+min+' to '+max+' characters')};
      text('name',3,60);text('summary',20,240);text('limitation',10,240);
      const lane=raw.lane;
      if(typeof lane!=='string'||!LANES.includes(lane))err(id,'lane','must be one of '+LANES.join(', '));else counts[lane]++;
      const team=raw.team;
      if(!Array.isArray(team)||team.length<1||team.length>4)err(id,'team','list 1 to 4 GitHub handles');
      else if(!team.every(h=>typeof h==='string'&&HANDLE.test(h)))err(id,'team','handles look like @name (letters, digits, - and _)');
      const rm=httpsUrl(raw.repo);
      if(rm)err(id,'repo',rm);else if(!example&&new URL(raw.repo).hostname!=='github.com')err(id,'repo','must be a github.com link so reviewers can clone it');
      if(raw.demo!==undefined){const m=httpsUrl(raw.demo);if(m)err(id,'demo',m)}
      if(raw.devnetSignature!==undefined){const s=raw.devnetSignature;if(typeof s!=='string'||s.length<86||s.length>88||!B58.test(s))err(id,'devnetSignature','a transaction signature is 86 to 88 base58 characters')}
      if(raw.programId!==undefined){const s=raw.programId;if(typeof s!=='string'||s.length<32||s.length>44||!B58.test(s))err(id,'programId','a program address is 32 to 44 base58 characters')}
      const t=raw.tests;
      if(t!==undefined){
        if(!isObj(t)||typeof t.command!=='string'||!t.command.trim())err(id,'tests','needs a command, for example npm test');
        else if(!Number.isInteger(t.passing)||!Number.isInteger(t.total)||t.total<1||t.passing<0||t.passing>t.total)err(id,'tests','passing and total must be whole numbers with 0 <= passing <= total and total >= 1');
      }else warn(id,'tests','no test evidence (the rubric scores reproducible tests)');
      if(raw.devnetSignature===undefined&&raw.programId===undefined)warn(id,'devnetSignature','no devnet evidence (add a transaction signature or a program address)');
      for(const k of ['summary','limitation','name']){const v=raw[k];if(typeof v==='string'&&RETURNS.test(v))warn(id,k,'mentions returns or profit. Judging ignores simulated returns; describe what the project does and what you tested')}
      if(raw.example!==undefined&&typeof raw.example!=='boolean')err(id,'example','must be true or false');
      if(example&&input.template===false)warn(id,'example','an EXAMPLE entry is still in the file');
    });
    return {ok:errors.length===0,errors,warnings,counts};
  }
  function devnetEvidence(p,check){
    if(p.devnetSignature){
      if(!check)return 'signature not checked';
      if(check.status==='failed')return 'transaction failed on devnet';
      if(check.status==='not-found')return 'signature not found on devnet';
      return check.status+' on devnet at slot '+check.slot;
    }
    return p.programId?'program address given, not checked':'no devnet evidence';
  }
  const testsEvidence=p=>p.tests?p.tests.passing+'/'+p.tests.total+' passing (self-reported)':'none';
  /* rubric.ts: total(scores) in points out of 100, one decimal */
  function total(criteria,scale,scores){
    let pts=0;
    for(const c of criteria){const s=Math.min(scale.max,Math.max(scale.min,Math.round(scores[c.id]??0)));pts+=c.weight*s/scale.max}
    return Math.round(pts*10)/10;
  }
  function suggestScores(p){
    const out={utility:2,tests:0,devnet:0,explanation:2,contribution:2};
    if(p.tests&&p.tests.total>0)out.tests=p.tests.passing===p.tests.total?3:(p.tests.passing/p.tests.total>=0.8?2:1);
    const d=(p.evidence&&p.evidence.devnet)||'';
    if(/^(finalized|confirmed|processed) on devnet/.test(d))out.devnet=3;
    else if(/not found|failed/.test(d))out.devnet=1;
    else if(p.devnetSignature)out.devnet=2;
    else if(p.programId)out.devnet=1;
    return out;
  }
  /* weakest criterion: the lowest share of its own maximum; ties go to the heavier weight */
  function weakest(criteria,scale,scores){
    let best=null;
    for(const c of criteria){const s=Math.min(scale.max,Math.max(scale.min,Math.round(scores[c.id]??0))),frac=s/scale.max;
      if(!best||frac<best.frac||(frac===best.frac&&c.weight>best.c.weight))best={c,frac}}
    return best.c;
  }
  const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  /* schedule.ts: n projects, 3+2 minute slots from 18:20; the table has max(n,1) rows up to maxSlots=7 plus overflow count */
  function schedule(order,maxSlots=7,first='18:20',demoMin=3,qaMin=2){
    const [h,m]=first.split(':').map(Number),t0=h*60+m,slots=[];
    for(let i=0;i<maxSlots;i++){const s=t0+i*(demoMin+qaMin);slots.push({slot:i+1,start:fmt(s),demoEnds:fmt(s+demoMin),end:fmt(s+demoMin+qaMin),projectId:order[i]??null})}
    return {slots,overflow:Math.max(0,order.length-maxSlots),window:first+'-'+slots[slots.length-1].end};
  }
  /* ship.ts verdict: ready when every required check passes */
  function shipVerdict(checks,okById){
    const req=checks.filter(c=>c.level==='required'),rp=req.filter(c=>okById[c.id]).length;
    return {ready:rp===req.length,passed:checks.filter(c=>okById[c.id]).length,total:checks.length,requiredPassed:rp,requiredTotal:req.length};
  }
  return {LANES,validate,devnetEvidence,testsEvidence,total,suggestScores,weakest,schedule,shipVerdict};
})();
if(typeof module!=='undefined')module.exports=CALC;
</script>
<script>/* Live mode: read-only public Solana data, straight from the browser. No keys, no wallets, no writes.
   Browser-safe RPC: solana-rpc.publicnode.com (api.mainnet.solana.com returns 403 for browser Origins). */
const LIVE=(()=>{
  const RPC=(typeof HASH!=='undefined'&&HASH.get('rpc'))||'https://solana-rpc.publicnode.com';
  const POOL='Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE',SOL_MINT='So11111111111111111111111111111111111111112',USDC_MINT='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v';
  const PYTH_ACCOUNT='7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE',PYTH_OWNER='rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ',PYTH_DISC='22f123639d7ef4cd';
  const A58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function b58(b){let n=0n;for(const x of b)n=n*256n+BigInt(x);let s='';while(n>0n){s=A58[Number(n%58n)]+s;n/=58n}for(const x of b){if(x===0)s='1'+s;else break}return s}
  function fromB64(s){const r=atob(s),u=new Uint8Array(r.length);for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  const hex=(u,a,b)=>Array.from(u.slice(a,b),x=>x.toString(16).padStart(2,'0')).join('');
  let id=1;
  async function rpc(method,params,url){
    const r=await fetch(url||RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:id++,method,params})});
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.error){const e=new Error(j.error.message||'rpc error');e.rate=/429|rate|too many/i.test(JSON.stringify(j.error));throw e}
    return j.result;
  }
  async function account(addr){
    const r=await rpc('getAccountInfo',[addr,{encoding:'base64',commitment:'confirmed'}]);
    if(!r||!r.value)throw new Error('account not found');
    return {slot:r.context.slot,owner:r.value.owner,bytes:fromB64(r.value.data[0])};
  }
  /* Pyth SOL/USD PriceUpdateV2 account: price i64@73, conf i64@81, expo i32@89, publish time i64@93, posted slot u64@125 */
  async function fetchPythPrice(){
    const a=await account(PYTH_ACCOUNT);
    if(a.owner!==PYTH_OWNER)throw new Error('unexpected Pyth owner');
    const u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    if(u.length<133||hex(u,0,8)!==PYTH_DISC)throw new Error('not a Pyth price account');
    const expo=v.getInt32(89,true);
    return {price:Number(v.getBigInt64(73,true))*10**expo,publishTime:Number(v.getBigInt64(93,true)),postedSlot:Number(v.getBigUint64(125,true)),currentSlot:a.slot};
  }
  /* Orca whirlpool: sqrtPrice u128@65 (Q64.64); price = (sqrt/2^64)^2 * 10^(9-6) */
  async function fetchOrcaPrice(){
    const a=await account(POOL),u=a.bytes,v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    const sq=(v.getBigUint64(73,true)<<64n)|v.getBigUint64(65,true);
    const r=Number(sq)/2**64;return {price:r*r*1000,slot:a.slot};
  }
  async function fetchJupiterQuote(){
    const r=await fetch('https://lite-api.jup.ag/swap/v1/quote?inputMint='+SOL_MINT+'&outputMint='+USDC_MINT+'&amount=1000000000&slippageBps=50');
    if(r.status===429)throw Object.assign(new Error('rate limited (HTTP 429)'),{rate:true});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();return {price:Number(j.outAmount)/1e6};
  }
  /* swaps: same rule as code/src/swaps.ts. A swap moves the two pool vaults in opposite directions. */
  let vaults=null;
  async function loadVaults(){
    if(vaults)return vaults;const a=await account(POOL),u=a.bytes;
    if(u.length<245||b58(u.slice(101,133))!==SOL_MINT||b58(u.slice(181,213))!==USDC_MINT)throw new Error('pool is not SOL/USDC');
